<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Upgrade Comparison</title>
<meta name="theme-color" content="#0a0a1c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Mona+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Same tokens as TOKENS in tools/build_site.py, so the site header injected
     into a published comparison matches the rest of mtg.grontved.xyz. */
  :root {
    color-scheme: dark;
    --ink: #0a0a1c; --ink-2: #0f0f27; --ink-3: #16163a;
    --line: rgba(176,176,255,.12); --line-2: rgba(176,176,255,.24);
    --paper: #f4f4fb; --text: #d9d9ea; --muted: #9696bd; --faint: #686894;
    --brand: #1d1df2; --lift: #8c8cff; --frame: #5b5be8;
    --in: #00f279; --out: #ff4f9a; --gc: #f2f200; --plan: #ffa31a;
    --display: "Oswald", "Arial Narrow", sans-serif;
    --body: "Mona Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --max: 1200px; --gut: clamp(16px, 4vw, 48px);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--text); font: 400 15px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
  body::after { content: ""; position: fixed; inset: 0; border: 3px solid var(--frame); pointer-events: none; z-index: 95; }
  ::selection { background: var(--brand); color: #fff; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 24px var(--gut) 80px; }
  h1 { font: 300 clamp(44px, 6vw, 80px)/.95 var(--display); letter-spacing: -.01em; color: var(--paper); margin: 10px 0 16px; }
  h2 { font: 300 clamp(32px, 3.6vw, 48px)/1 var(--display); color: var(--paper); margin: 72px 0 20px; }
  h3 { font: 400 20px/1.2 var(--display); color: var(--paper); margin: 0 0 8px; letter-spacing: .01em; }
  h4 { font: 500 11px/1.4 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  a { color: var(--lift); text-underline-offset: 3px; }
  code { font-family: var(--mono); font-size: .92em; }

  header.head { display: flex; gap: 32px; align-items: flex-start; padding-top: 12px; }
  header.head img { width: 170px; border-radius: 4.75% / 3.5%; flex: none; cursor: zoom-in; box-shadow: 0 20px 50px rgba(0,0,10,.6); }
  header.head > div > .small:first-child { font: 500 11px/1.5 var(--mono); letter-spacing: .09em; text-transform: uppercase; }
  header.head p { max-width: 72ch; }
  nav.jump { position: sticky; top: 0; z-index: 5; background: rgba(10,10,28,.88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); display: flex; gap: 8px 22px; flex-wrap: wrap; padding: 16px 0; margin-top: 28px; }
  nav.jump a { font: 500 11px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
  nav.jump a:hover { color: var(--paper); }

  .panel { background: var(--ink-2); border: 1px solid var(--line-2); padding: 20px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  ul.notes { margin: 0; padding: 0; list-style: none; }
  ul.notes li { margin-bottom: 8px; padding-left: 20px; position: relative; }
  ul.notes li::before { content: ""; position: absolute; left: 3px; top: .66em; width: 6px; height: 6px; background: var(--lift); }

  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font: 500 10.5px/1.4 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  td.num, th.num { text-align: right; font-family: var(--mono); font-size: 13px; white-space: nowrap; }
  th.num { font-size: 10.5px; }
  .table-scroll { overflow-x: auto; }
  .bad { color: var(--out); font-weight: 600; }
  .rec { color: var(--gc); font-weight: 500; }

  .curve { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-top: 16px; }
  .curve .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .curve .bars { position: relative; width: 100%; flex: 1; }
  .curve .ghost, .curve .fill { position: absolute; bottom: 0; }
  .curve .ghost { left: 0; right: 0; border: 1px dashed var(--faint); border-bottom: none; }
  .curve .fill { left: 20%; right: 20%; background: var(--lift); }
  .curve .val { font: 400 10.5px var(--mono); position: absolute; left: 0; right: 0; text-align: center; color: var(--text); }
  .curve .lbl { font: 400 10.5px var(--mono); color: var(--faint); margin-top: 5px; }
  .legend { font: 400 11px var(--mono); color: var(--muted); display: flex; gap: 16px; margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
  .legend .l-fill::before { background: var(--lift); }
  .legend .l-ghost::before { border: 1px dashed var(--faint); }
  .curves { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }

  section.dir { margin-top: 80px; }
  .dir-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line-2); }
  .dir-head h2 { font-size: clamp(34px, 4vw, 52px); }
  .pill { display: inline-block; font: 500 10px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; padding: 6px 8px;
    border: 1px solid var(--line-2); color: var(--muted); margin-left: 12px; vertical-align: middle; }
  .pill.rec { color: var(--gc); border-color: color-mix(in srgb, var(--gc) 40%, transparent); }
  .pill.picked { color: var(--in); border-color: color-mix(in srgb, var(--in) 40%, transparent); }
  .pill.gc { color: var(--gc); border-color: color-mix(in srgb, var(--gc) 40%, transparent); }
  .totals { font: 400 12px/1.5 var(--mono); color: var(--muted); }
  .totals b { color: var(--paper); font-weight: 500; }

  .swaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; margin-top: 18px; }
  .swap { background: var(--ink-2); border: 1px solid var(--line); padding: 14px; }
  .swap .pair { display: grid; grid-template-columns: 1fr 22px 1fr; align-items: center; gap: 6px; }
  .swap .arrow { text-align: center; color: var(--faint); font: 400 14px var(--mono); }
  .swap .why { font-size: 14px; margin-top: 12px; color: var(--text); }
  .card { position: relative; }
  .card img { width: 100%; display: block; border-radius: 4.75% / 3.5%; cursor: zoom-in; background: var(--ink-3); aspect-ratio: 488/680; }
  .card.out img { filter: grayscale(1) brightness(.6); transition: filter .25s; }
  .card.out:hover img { filter: none; }
  .card .tag { position: absolute; top: 6px; left: 6px; font: 500 9.5px/1 var(--mono); padding: 4px 6px; letter-spacing: .1em; background: rgba(6,6,20,.88); }
  .card.in .tag { color: var(--in); }
  .card.out .tag { color: var(--out); }
  .card .meta { font: 400 11px/1.4 var(--mono); margin-top: 6px; display: flex; justify-content: space-between; gap: 6px; }
  .card .meta a { color: var(--muted); text-decoration: none; }
  .card .meta .price { white-space: nowrap; color: var(--text); }
  .card .name-fallback { aspect-ratio: 488/680; border: 1px dashed var(--line-2); display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; font: 500 12px var(--mono); }
  .swap .flags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .swap .flags .pill { margin-left: 0; }
  details.buy { margin-top: 16px; background: var(--ink-2); border: 1px solid var(--line-2); }
  details.buy[open] { border-color: var(--lift); }
  details.buy summary { cursor: pointer; padding: 14px 16px; list-style: none; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    font: 400 15px/1.3 var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--paper); }
  details.buy summary::-webkit-details-marker { display: none; }
  details.buy summary::before { content: "+"; margin-right: 10px; color: var(--lift); font-family: var(--mono); }
  details.buy[open] summary::before { content: "−"; }
  details.buy summary .t { flex: 1; }
  details.buy summary > span:last-child { font: 400 12px var(--mono); letter-spacing: 0; text-transform: none; color: var(--text); }
  details.buy .body { padding: 0 16px 16px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  details.buy textarea { width: 100%; min-height: 240px; font: 13px/1.5 var(--mono); background: var(--ink); color: var(--text);
    border: 1px solid var(--line-2); padding: 10px; resize: vertical; }
  .copy-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  button.copy { font: 500 12px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 9px 14px; border: 1px solid var(--paper);
    background: var(--paper); color: var(--brand); cursor: pointer; }
  button.copy:hover { background: #fff; }
  .copied { font: 500 11px var(--mono); color: var(--in); }
  details.htp summary .muted { flex-basis: 100%; margin-left: 22px; font: 400 14px/1.5 var(--body); letter-spacing: 0; text-transform: none; color: var(--muted); }
  .htp-body { padding: 0 16px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px 28px; }
  .htp-sec h4 { margin: 8px 0 8px; }
  .htp-sec ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .htp-sec li { margin-bottom: 6px; }
  .htp-sec li::marker { color: var(--lift); }
  @media (max-width: 720px) { details.buy .body { grid-template-columns: 1fr; } }

  #lightbox { position: fixed; inset: 0; background: rgba(5,5,18,.88); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); display: none;
    align-items: center; justify-content: center; gap: 16px; z-index: 100; padding: 16px; cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img { max-height: 90vh; max-width: min(46vw, 488px); border-radius: 4.75% / 3.5%; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  #lightbox img:only-child { max-width: 92vw; }

  footer { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--line); font: 400 11px/1.6 var(--mono); color: var(--faint); }
  @media (max-width: 720px) {
    header.head { flex-direction: column; }
    header.head img { width: 130px; }
    .grid2 { grid-template-columns: 1fr; }
    .swaps { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<!--SITE_NAV-->
<div class="wrap" id="app"></div>
<div id="lightbox"></div>
<script id="data" type="application/json">__COMPARISON_DATA__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const k = n => n.trim().toLowerCase();
  const card = n => D.cards[k(n)] || null;
  const price = n => D.prices[k(n)] || {};
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = (v, sym) => v == null ? "—" : sym + v.toFixed(2);
  const both = (u, e) => `${money(u, "$")} · ${money(e, "€")}`;
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-");

  document.title = D.title || "Deck Upgrade Comparison";

  function cardHTML(name, role) {
    const c = card(name), p = price(name);
    const img = c && c.images[0] && c.images[0].normal
      ? `<img loading="lazy" src="${esc(c.images[0].normal)}" alt="${esc(name)}" data-name="${esc(name)}">`
      : `<div class="name-fallback">${esc(name)}</div>`;
    const mv = c ? `MV ${c.cmc}` : "";
    const link = c && c.scryfall_uri ? `<a href="${esc(c.scryfall_uri)}" target="_blank" rel="noopener">${mv || "Scryfall"}</a>` : mv;
    const tip = [p.usd_set && `cheapest $: ${p.usd_set}`, p.eur_set && `cheapest €: ${p.eur_set}`].filter(Boolean).join(" | ");
    return `<div class="card ${role}">${img}<span class="tag">${role.toUpperCase()}</span>
      <div class="meta"><span class="muted">${link}</span><span class="price" title="${esc(tip)}">${both(p.usd, p.eur)}</span></div></div>`;
  }

  function curveHTML(buckets, ghost, max) {
    return `<div class="curve">${D.curve_buckets.map(b => {
      const v = buckets[b], g = ghost ? ghost[b] : null;
      const h = x => (x / max * 100).toFixed(1) + "%";
      const diff = g != null && g !== v ? ` <span class="muted">(${v > g ? "+" : ""}${v - g})</span>` : "";
      return `<div class="col"><div class="bars">
        ${g != null ? `<div class="ghost" style="height:${h(g)}"></div>` : ""}
        <div class="fill" style="height:${h(v)}"></div>
        <div class="val" style="bottom:calc(${h(Math.max(v, g ?? 0))} + 1px)">${v}${diff}</div>
      </div><div class="lbl">${b}</div></div>`;
    }).join("")}</div>`;
  }

  function swapsHTML(swaps) {
    const flags = s => [(card(s.in) || {}).game_changer && `<span class="pill gc">Game Changer</span>`,
      s.owned && `<span class="pill picked">already owned</span>`,
      s.pending && `<span class="pill">not bought yet</span>`,
      s.date && `<span class="pill">${esc(s.date)}</span>`].filter(Boolean).join("");
    return `<div class="swaps">${swaps.map(s => `
      <div class="swap"><div class="pair">${cardHTML(s.out, "out")}<div class="arrow">→</div>${cardHTML(s.in, "in")}</div>
      ${flags(s) ? `<div class="flags">${flags(s)}</div>` : ""}
      ${s.why ? `<div class="why">${esc(s.why)}</div>` : ""}</div>`).join("")}</div>`;
  }

  // Plain buy list (used by the bracket 3 package): price table + copyable text
  function listHTML(id, title, swaps, open) {
    const items = swaps.filter(s => !s.owned).map(s => ({ ...s, p: price(s.in) })).sort((a, b) => (b.p.eur ?? 0) - (a.p.eur ?? 0));
    const sum = cur => items.reduce((t, s) => t + (s.p[cur] ?? 0), 0);
    return `<details class="buy"${open ? " open" : ""}>
      <summary><span class="t">${esc(title)}: ${items.length} cards</span><span>${both(sum("usd"), sum("eur"))}</span></summary>
      <div class="body">
        <div class="table-scroll"><table>
          <tr><th>Card</th><th class="num">EUR</th><th class="num">USD</th><th>Replaces</th></tr>
          ${items.map(s => `<tr><td>${esc(s.in)}${(card(s.in) || {}).game_changer ? ` <span class="muted small">(Game Changer)</span>` : ""}</td>
            <td class="num" title="${esc(s.p.eur_set || "")}">${money(s.p.eur, "€")}</td>
            <td class="num" title="${esc(s.p.usd_set || "")}">${money(s.p.usd, "$")}</td>
            <td class="small muted">${esc(s.out)}</td></tr>`).join("")}
          <tr><td><b>Total</b></td><td class="num"><b>${money(sum("eur"), "€")}</b></td><td class="num"><b>${money(sum("usd"), "$")}</b></td><td></td></tr>
        </table></div>
        <div>
          <div class="copy-row"><button class="copy" data-copy="${id}">Copy list</button><span class="copied" hidden>Copied ✓</span></div>
          <textarea id="${id}" readonly>${esc(items.map(s => `1 ${s.in}`).join("\n"))}</textarea>
          <p class="small muted" style="margin-top:6px">Cardmarket: Wants → create a Magic list → <b>Add Deck List</b> → paste → <b>Add</b>, then run the <b>Shopping Wizard</b>.</p>
        </div>
      </div></details>`;
  }

  // Buy list for one direction (core package + its own swaps), Cardmarket Wants format
  function buyHTML(d) {
    const core = (D.core && D.core.swaps) || [];
    const items = [...core.map(s => ({ ...s, part: D.core.name })), ...d.swaps.map(s => ({ ...s, part: d.name }))]
      .map(s => ({ ...s, p: price(s.in) }))
      .sort((a, b) => (b.p.eur ?? 0) - (a.p.eur ?? 0));
    const text = items.map(s => `1 ${s.in}`).join("\n");
    const budget = D.budget_eur != null ? ` · budget €${D.budget_eur}` : D.budget_usd != null ? ` · budget $${D.budget_usd}` : "";
    return `<details class="buy"${d.picked ? " open" : ""}>
      <summary><span class="t">Buy list: ${items.length} cards</span><span>${both(d.cost_usd, d.cost_eur)}${budget}</span></summary>
      <div class="body">
        <div class="table-scroll"><table>
          <tr><th>Card</th><th class="num">EUR</th><th class="num">USD</th><th>Replaces</th></tr>
          ${items.map(s => `<tr><td>${esc(s.in)}${s.part !== d.name ? ` <span class="muted small">(core)</span>` : ""}</td>
            <td class="num" title="${esc(s.p.eur_set || "")}">${money(s.p.eur, "€")}</td>
            <td class="num" title="${esc(s.p.usd_set || "")}">${money(s.p.usd, "$")}</td>
            <td class="small muted">${esc(s.out)}</td></tr>`).join("")}
          <tr><td><b>Total</b></td><td class="num"><b>${money(d.cost_eur, "€")}</b></td><td class="num"><b>${money(d.cost_usd, "$")}</b></td><td></td></tr>
        </table></div>
        <div>
          <div class="copy-row"><button class="copy" data-copy="buy-${slug(d.id || d.name)}">Copy list</button><span class="copied" hidden>Copied ✓</span></div>
          <textarea id="buy-${slug(d.id || d.name)}" readonly>${esc(text)}</textarea>
          <p class="small muted" style="margin-top:6px">Cardmarket: Wants → create a Magic list → <b>Add Deck List</b> → paste → <b>Add</b>, then run the <b>Shopping Wizard</b>. Also works for TCGplayer Mass Entry.</p>
        </div>
      </div></details>`;
  }

  // How-to-play guide for one direction (optional `how_to_play` in the spec)
  function htpHTML(d) {
    const g = d.how_to_play;
    if (!g) return "";
    return `<details class="buy htp"${d.picked ? " open" : ""}>
      <summary><span class="t">How to play</span><span class="muted small">${esc(g.summary || "")}</span></summary>
      <div class="htp-body">${(g.sections || []).map(sec => `<div class="htp-sec"><h4>${esc(sec.title)}</h4>
        <ul>${(sec.points || []).map(pt => `<li>${esc(pt)}</li>`).join("")}</ul></div>`).join("")}</div></details>`;
  }

  const dirs = D.directions;
  const stock = D.stock_curve;
  const maxBar = Math.max(...[stock, ...dirs.map(d => d.curve)].flatMap(c => Object.values(c.buckets))) + 2;
  const metricKeys = [...new Set(dirs.flatMap(d => Object.keys(d.metrics || {})))];
  const stockMetrics = (D.analysis && D.analysis.stock_metrics) || {};
  const cmd = D.commanders.map(card).filter(Boolean)[0];

  let h = "";
  h += `<header class="head">${cmd && cmd.images[0] ? `<img src="${esc(cmd.images[0].normal)}" alt="${esc(cmd.name)}" data-name="${esc(cmd.name)}">` : ""}
    <div><div class="muted small">${esc(D.deck)} · ${esc(D.date || "")}</div><h1>${esc(D.title)}</h1>
    ${D.summary ? `<p>${esc(D.summary)}</p>` : ""}
    <p class="muted small">Prices: cheapest paper printing on Scryfall (USD from TCGplayer, EUR from Cardmarket), Scryfall bulk data of ${esc(D.prices_as_of || "?")}. Hover a price to see which printing.</p></div></header>`;

  h += `<nav class="jump"><a href="#analysis">Stock analysis</a><a href="#compare">Comparison</a>
    ${D.core && D.core.swaps.length ? `<a href="#core">${esc(D.core.name)}</a>` : ""}
    ${dirs.map(d => `<a href="#${slug(d.id || d.name)}">${esc(d.name)}</a>`).join("")}
    ${(D.deck_changes || []).length ? `<a href="#changes">Later changes</a>` : ""}
    ${D.bracket3 ? `<a href="#bracket3">${esc(D.bracket3.name)}</a>` : ""}</nav>`;

  // Stock analysis
  const A = D.analysis || {};
  h += `<h2 id="analysis">Stock deck analysis</h2><div class="grid2">
    <div class="panel"><h3>Mana curve <span class="muted small">· ${stock.nonland} nonland · avg MV ${stock.average}</span></h3>
      ${curveHTML(stock.buckets, null, maxBar)}
      ${A.notes ? `<ul class="notes" style="margin-top:12px">${A.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}</div>
    <div class="panel"><h3>Interaction & key categories</h3><div class="table-scroll"><table>
      <tr><th>Category</th><th class="num">Stock</th><th class="num">Target</th><th>Cards</th></tr>
      ${(A.interaction || []).map(r => `<tr><td>${esc(r.category)}</td><td class="num ${r.low ? "bad" : ""}">${esc(r.stock)}</td>
        <td class="num">${esc(r.target)}</td><td class="small muted">${esc((r.cards || []).join(", "))}</td></tr>`).join("")}
    </table></div></div></div>`;

  // Comparison
  h += `<h2 id="compare">Direction comparison</h2><div class="panel table-scroll"><table>
    <tr><th></th><th class="num">Stock</th>${dirs.map(d => `<th class="num">${esc(d.name)}${d.recommended ? ` <span class="rec">★</span>` : ""}${d.picked ? ` <span class="pill picked">✓ picked</span>` : ""}</th>`).join("")}</tr>
    <tr><td>Average MV (nonland)</td><td class="num">${stock.average}</td>${dirs.map(d => `<td class="num">${d.curve.average}</td>`).join("")}</tr>
    <tr><td>Cost of cards in</td><td class="num">—</td>${dirs.map(d => `<td class="num"><b>${both(d.cost_usd, d.cost_eur)}</b></td>`).join("")}</tr>
    <tr><td>Value of cards out</td><td class="num">—</td>${dirs.map(d => `<td class="num muted">${both(d.out_value_usd, d.out_value_eur)}</td>`).join("")}</tr>
    ${metricKeys.map(m => `<tr><td>${esc(m)}</td><td class="num">${esc(stockMetrics[m] ?? "")}</td>${dirs.map(d => `<td class="num">${esc((d.metrics || {})[m] ?? "")}</td>`).join("")}</tr>`).join("")}
    <tr><td>Plays like</td><td></td>${dirs.map(d => `<td class="small">${esc(d.plays_like || "")}</td>`).join("")}</tr>
    </table>${D.core && D.core.swaps.length ? `<p class="small muted" style="margin-top:8px">Costs include the ${esc(D.core.name)} (${both(D.core.cost_usd, D.core.cost_eur)}).</p>` : ""}</div>`;

  h += `<div class="curves" style="margin-top:16px">${dirs.map(d => `<div class="panel"><h3>${esc(d.name)} <span class="muted small">avg ${d.curve.average}</span></h3>
    ${curveHTML(d.curve.buckets, stock.buckets, maxBar)}</div>`).join("")}</div>
    <div class="legend"><span class="l-fill">after swaps</span><span class="l-ghost">stock</span></div>`;
  if (D.recommendation) h += `<div class="panel" style="margin-top:16px"><b class="rec">★ Recommendation.</b> ${esc(D.recommendation)}</div>`;

  // Core package
  if (D.core && D.core.swaps.length) {
    h += `<section class="dir" id="core"><div class="dir-head"><h2 style="margin:0">${esc(D.core.name)}<span class="pill">all directions</span></h2>
      <div class="totals">In: <b>${both(D.core.cost_usd, D.core.cost_eur)}</b></div></div>
      ${D.core.description ? `<p class="muted">${esc(D.core.description)}</p>` : ""}${swapsHTML(D.core.swaps)}</section>`;
  }

  // Directions
  for (const d of dirs) {
    h += `<section class="dir" id="${slug(d.id || d.name)}"><div class="dir-head">
      <h2 style="margin:0">${esc(d.name)}${d.picked ? `<span class="pill picked">✓ picked</span>` : ""}${d.recommended ? `<span class="pill rec">★ recommended</span>` : ""}</h2>
      <div class="totals">Direction swaps + core: <b>${both(d.cost_usd, d.cost_eur)}</b> · avg MV ${d.curve.average}</div></div>
      ${d.pitch ? `<p class="muted">${esc(d.pitch)}</p>` : ""}${d.win_conditions_note ? `<p class="small"><b>Win conditions:</b> ${esc(d.win_conditions_note)}</p>` : ""}${buyHTML(d)}${htpHTML(d)}${swapsHTML(d.swaps)}</section>`;
  }

  // Changes made to the played deck after the picked direction was applied
  if ((D.deck_changes || []).length) {
    h += `<section class="dir" id="changes"><div class="dir-head"><h2 style="margin:0">Later changes<span class="pill picked">✓ in the deck</span></h2></div>
      <p class="muted">Swaps made in ${esc(D.played_deck || "the deck")} after the picked direction was applied. The picked direction plus these is the deck as you play it.</p>
      ${swapsHTML(D.deck_changes)}</section>`;
  }

  // Bracket 3 package: against the deck as played, always the last section
  const B = D.bracket3;
  if (B) {
    const gcAll = B.gc_now.length + B.gc_core.length + B.gc_premium.length - B.gc_out.length;
    const wc = B.win_conditions || {};
    h += `<section class="dir" id="bracket3"><div class="dir-head">
      <h2 style="margin:0">${esc(B.name)}${B.applied ? `<span class="pill picked">✓ in the deck since ${esc(B.applied)}</span>` : ""}${B.declined ? `<span class="pill">not planned</span>` : ""}<span class="pill gc">up to 3 Game Changers</span></h2>
      <div class="totals">Package: <b>${both(B.cost_usd, B.cost_eur)}</b>${B.budget_eur != null ? ` · budget €${B.budget_eur}` : ""} · avg MV ${B.avg_now} → ${B.avg_after}</div></div>
      ${B.declined ? `<p><b>Not planned.</b> On ${esc(B.declined)} you chose to keep this deck as it is, so these swaps are kept here for reference only.</p>` : ""}
      <p class="muted">${esc(B.description || "")}</p>
      <p class="small muted">${esc(B.rule || "")} ${B.applied ? `These swaps are in ${esc(D.played_deck || D.deck)} since ${esc(B.applied)}; "Before" is the deck just before them.` : `These swaps apply to ${esc(D.played_deck || D.deck)}, the deck as you play it now${B.date ? ` (${esc(B.date)})` : ""}.`}</p>
      <div class="panel table-scroll" style="margin:12px 0"><table>
        <tr><th></th><th class="num">${B.applied ? "Before" : "Now"}</th><th class="num">${B.applied ? "With the package (now)" : "With the package"}</th><th class="num">With every premium option</th></tr>
        <tr><td>Game Changers (bracket 3 allows 3)</td><td class="num">${B.gc_now.length}</td><td class="num">${B.gc_now.length + B.gc_core.length}</td><td class="num">${gcAll}</td></tr>
        <tr><td>Which</td><td class="small muted">${esc(B.gc_now.join(", ") || "none")}</td><td class="small muted">${esc([...B.gc_now, ...B.gc_core].join(", ") || "none")}</td><td class="small muted">${esc([...B.gc_now, ...B.gc_core, ...B.gc_premium].filter(n => !B.gc_out.includes(n)).join(", ") || "none")}</td></tr>
        ${wc.now != null ? `<tr><td>Win conditions</td><td class="num">${esc(wc.now)}</td><td class="num">${esc(wc.after)}</td><td class="num"></td></tr>` : ""}
        <tr><td>Cost of cards in</td><td class="num">—</td><td class="num"><b>${both(B.cost_usd, B.cost_eur)}</b></td><td class="num">${both(B.cost_usd + B.premium_cost_usd, B.cost_eur + B.premium_cost_eur)}</td></tr>
      </table></div>
      ${(B.notes || []).length ? `<ul class="notes">${B.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      ${listHTML("buy-bracket3", B.applied ? "Bought" : "Buy list", B.swaps, !B.applied && !B.declined)}
      ${swapsHTML(B.swaps)}
      ${(B.premium || []).length ? `<h3 style="margin:24px 0 4px">Premium options</h3>
        <p class="muted">Stronger and more expensive. Each one is optional and comes with its own cut. Together: ${both(B.premium_cost_usd, B.premium_cost_eur)}.</p>
        ${listHTML("buy-bracket3-premium", "Premium buy list", B.premium, false)}${swapsHTML(B.premium)}` : ""}
      </section>`;
  }

  h += `<footer>Card images and prices via <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>. Generated ${esc(D.generated)}. Rebuild with <code>python3 tools/build_comparison.py &lt;spec&gt;.json</code>.</footer>`;
  document.getElementById("app").innerHTML = h;

  // Lightbox: click any card image for the large scan (both faces for DFCs)
  const lb = document.getElementById("lightbox");
  // Copy buttons for buy lists (clipboard API, with a select+execCommand fallback for file:// pages)
  document.addEventListener("click", async e => {
    const btn = e.target.closest("button.copy");
    if (!btn) return;
    const ta = document.getElementById(btn.dataset.copy);
    try { await navigator.clipboard.writeText(ta.value); }
    catch { ta.select(); document.execCommand("copy"); }
    const ok = btn.parentElement.querySelector(".copied");
    ok.hidden = false; setTimeout(() => { ok.hidden = true; }, 1800);
  });

  document.addEventListener("click", e => {
    if (e.target.closest("#lightbox")) { lb.classList.remove("open"); lb.innerHTML = ""; return; }
    const img = e.target.closest("img[data-name]");
    if (!img) return;
    const c = card(img.dataset.name);
    lb.innerHTML = (c ? c.images : [{ large: img.src }]).map(i => `<img src="${esc(i.large || i.normal)}" alt="">`).join("");
    lb.classList.add("open");
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { lb.classList.remove("open"); lb.innerHTML = ""; } });
})();
</script>
</body>
</html>
