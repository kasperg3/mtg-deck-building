<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Upgrade Comparison</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #efede8; --text: #1d1c1a; --muted: #6b6862;
    --border: #dcd8d0; --accent: #4f46e5; --in: #15803d; --in-bg: #dcfce7; --out: #b91c1c; --out-bg: #fee2e2;
    --bar: #4f46e5; --bar-ghost: #c7c3ba; --star: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --surface: #1e1d1b; --surface-2: #2a2926; --text: #ecebe7; --muted: #a29f97;
      --border: #3a3834; --accent: #8b85ff; --in: #4ade80; --in-bg: #14321f; --out: #f87171; --out-bg: #3b1717;
      --bar: #8b85ff; --bar-ghost: #4a4843; --star: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --surface: #1e1d1b; --surface-2: #2a2926; --text: #ecebe7; --muted: #a29f97;
    --border: #3a3834; --accent: #8b85ff; --in: #4ade80; --in-bg: #14321f; --out: #f87171; --out-bg: #3b1717;
    --bar: #8b85ff; --bar-ghost: #4a4843; --star: #fbbf24;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h2 { font-size: 21px; margin: 40px 0 12px; }
  h3 { font-size: 17px; margin: 0 0 6px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  a { color: var(--accent); }

  header.top { display: flex; gap: 20px; align-items: flex-start; }
  header.top img { width: 150px; border-radius: 8px; flex: none; cursor: zoom-in; }
  nav.jump { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0; margin-top: 20px; }
  nav.jump a { text-decoration: none; padding: 4px 10px; border-radius: 999px; background: var(--surface-2);
    color: var(--text); font-size: 13px; }
  nav.jump a:hover { background: var(--accent); color: #fff; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  ul.notes { margin: 0; padding-left: 18px; }
  ul.notes li { margin-bottom: 4px; }

  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table-scroll { overflow-x: auto; }
  .bad { color: var(--out); font-weight: 600; }
  .rec { color: var(--star); font-weight: 600; }

  .curve { display: flex; align-items: flex-end; gap: 4px; height: 110px; padding-top: 14px; }
  .curve .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .curve .bars { position: relative; width: 100%; flex: 1; }
  .curve .ghost, .curve .fill { position: absolute; bottom: 0; border-radius: 3px 3px 0 0; }
  .curve .ghost { left: 0; right: 0; border: 1.5px dashed var(--bar-ghost); border-bottom: none; }
  .curve .fill { left: 18%; right: 18%; background: var(--bar); }
  .curve .val { font-size: 11px; font-variant-numeric: tabular-nums; position: absolute; left: 0; right: 0; text-align: center; }
  .curve .lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .legend { font-size: 12px; color: var(--muted); display: flex; gap: 14px; margin-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; }
  .legend .l-fill::before { background: var(--bar); }
  .legend .l-ghost::before { border: 1.5px dashed var(--bar-ghost); }

  .curves { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }

  section.dir { margin-top: 44px; }
  .dir-head { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); margin-left: 6px; }
  .pill.rec { background: var(--star); color: #fff; }

  .swaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; margin-top: 14px; }
  .swap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .swap .pair { display: grid; grid-template-columns: 1fr 22px 1fr; align-items: center; gap: 6px; }
  .swap .arrow { text-align: center; color: var(--muted); font-size: 18px; }
  .swap .why { font-size: 13px; margin-top: 10px; color: var(--text); }
  .card { position: relative; }
  .card img { width: 100%; display: block; border-radius: 4.75% / 3.5%; cursor: zoom-in; background: var(--surface-2); aspect-ratio: 488/680; }
  .card.out img { filter: grayscale(.55) brightness(.9); }
  .card .tag { position: absolute; top: 6px; left: 6px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; letter-spacing: .04em; }
  .card.in .tag { background: var(--in-bg); color: var(--in); }
  .card.out .tag { background: var(--out-bg); color: var(--out); }
  .card .meta { font-size: 12px; margin-top: 5px; display: flex; justify-content: space-between; gap: 6px; }
  .card .meta .price { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .card .name-fallback { aspect-ratio: 488/680; border: 1px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; font-weight: 600; }
  .totals { font-size: 14px; margin-top: 10px; }
  .pill.picked { background: var(--in-bg); color: var(--in); font-weight: 600; }
  details.buy { margin-top: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  details.buy[open] { border-color: var(--accent); }
  details.buy summary { cursor: pointer; padding: 12px 16px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  details.buy summary::-webkit-details-marker { display: none; }
  details.buy summary::before { content: "▸"; margin-right: 6px; color: var(--muted); }
  details.buy[open] summary::before { content: "▾"; }
  details.buy summary .t { flex: 1; }
  details.buy .body { padding: 0 16px 16px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  details.buy textarea { width: 100%; min-height: 240px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; resize: vertical; }
  .copy-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  button.copy { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer; }
  button.copy:hover { filter: brightness(1.1); }
  .copied { font-size: 13px; color: var(--in); }
  details.htp summary .muted { flex-basis: 100%; font-weight: 400; margin-left: 18px; }
  .htp-body { padding: 0 16px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px 24px; }
  .htp-sec h4 { margin: 4px 0 6px; font-size: 14px; }
  .htp-sec ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .htp-sec li { margin-bottom: 4px; }
  @media (max-width: 720px) { details.buy .body { grid-template-columns: 1fr; } }

  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; gap: 12px; z-index: 50; padding: 16px; cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img { max-height: 90vh; max-width: min(46vw, 488px); border-radius: 18px; }
  #lightbox img:only-child { max-width: 92vw; }

  footer { margin-top: 50px; font-size: 12px; color: var(--muted); }
  @media (max-width: 720px) {
    header.top { flex-direction: column; }
    header.top img { width: 120px; }
    .grid2 { grid-template-columns: 1fr; }
    .swaps { grid-template-columns: 1fr; }
  }
</style>
</head>

<script id="data" type="application/json">{"title": "Landing Party \u2014 Upgrade Options", "deck": "decks/precon/landing-party.md", "date": "2026-11-01", "budget_eur": 20, "summary": "Commander Spock pays off land names: on every enter and attack he reveals the top card and lets you cast it for free when its mana value is at most the number of differently named lands you control, puts a land onto the battlefield tapped, and otherwise draws you the card. The stock list already ramps and lands 35 different names, but it only has three real answers, it fires its ten landfall payoffs once a turn because Exploration is the only extra land drop, and it gives Spock no evasion, no protection and no way to choose the card on top. Each direction therefore buys four shared answers plus one engine of six cards, so the swaps read as a package rather than six independent one-for-ones.", "analysis": {"notes": ["Curve is high: 60 nonland cards at an average MV of 3.60, with ten at six mana or more (eight at six, Lt. Arex at seven, Planet Killer at eight).", "Spock's free-cast ceiling is the number of differently named lands on the battlefield \u2014 35 names across 40 lands, but 4 Forest, 2 Island and 2 Plains mean those 40 cards only ever count as 35, and the ceiling creeps up one name at a time.", "Only three cards answer a resolved creature (Path to Exile, Reality Shift, Beast Within), and those same three are the deck's entire instant-speed interaction.", "Sixteen lands enter tapped (thirteen outright, plus three fetch lands that bring one in tapped), and four more \u2014 Mutavault, Reliquary Tower, Temple of the False God, Shore Leave Planet \u2014 do less for the mana base than a plain dual, in a three-colour deck.", "The Spacecraft half of the list wants creatures tapped for Station charge counters (6+ for Galileo, 16+ for Enterprise) and rarely gets there; Kirk's +3/+3 is the only payoff that comes online early.", "The landfall shell is lopsided: ten cards pay off a land entering (Lotus Cobra, Scute Swarm, Tireless Tracker, Amanda Grayson, Chief Kyle, M'Ress, Syndicate Liquidators, Galileo, Enterprise, Farragut) and only Exploration adds a land drop, so those ten fire once a turn. The multiplier the list is missing is land drops, not more payoffs.", "Spock is a 3/5 with no evasion and no protection, and his trigger is only as good as the top card: one card (Augur of Autumn) lets you look at the top, and nothing in the list puts a chosen card there. A sixth of the deck rewards attacking with him and the deck cannot guarantee he survives or connects.", "Interaction and engine are separate problems, so they are costed separately here: the shared four fix removal in every direction, and the six direction cards are spent on one engine rather than six unrelated upgrades."], "interaction": [{"category": "Spot removal", "stock": 3, "target": "8\u201310", "low": true, "cards": ["Path to Exile", "Reality Shift", "Beast Within"]}, {"category": "Board wipes", "stock": 2, "target": "2\u20133", "cards": ["Wrath of God", "Austere Command"]}, {"category": "Instant-speed answers", "stock": 3, "target": "5+", "low": true, "cards": ["Path to Exile", "Reality Shift", "Beast Within"]}, {"category": "Protection", "stock": 3, "target": "2\u20133", "cards": ["Heroic Intervention", "U.S.S. Defiant, Mirror Migrant", "Temporal Tribulation"]}, {"category": "Card draw", "stock": 11, "target": "8\u201310", "cards": ["Brainstorm", "Ponder", "Harmonize", "Echo of Eons", "Guardian Project", "Tireless Tracker", "Sam Kirk, Xenoanthropologist", "Pavel Chekov, First Posting", "Jefferies Tube", "Starfleet Communicator", "Lt. Arex, Ever-Adapting"]}, {"category": "Ramp", "stock": 10, "target": "8\u201310", "cards": ["Sol Ring", "Arcane Signet", "Lotus Cobra", "Farseek", "Nature's Lore", "Rampant Growth", "Cultivate", "Growth Spiral", "Exploration", "Satyr Wayfinder"]}, {"category": "Lands", "stock": 40, "target": "40+ (lands deck)", "cards": ["35 differently named"]}], "stock_metrics": {"Spot removal": 3, "Board wipes": 2, "Instant-speed answers": 3, "Protection": 3, "Card draw": 11, "Ramp": 10, "Extra land drops": 1, "Landfall payoffs": 10, "Lands": 40, "Different land names": 35, "Game Changers": 0}}, "core": {"name": "Shared answers", "description": "Four cheap instants that go in every direction. Spot removal goes from three to six \u2014 all of it instant speed \u2014 and Counterspell stops a spell on the stack, which nothing in the list could do before.", "swaps": [{"in": "Swords to Plowshares", "out": "Planet Killer", "why": "One mana exiles any creature at instant speed, which is the cheapest answer in the deck. Planet Killer costs eight, must attack every combat if able, and does nothing the turn it lands."}, {"in": "Generous Gift", "out": "Command Chair", "why": "Three mana destroys any permanent type, including the lands and enchantments the list otherwise cannot touch. Command Chair is six mana, enters tapped and only ever ramps."}, {"in": "Krosan Grip", "out": "Giant Space Amoeba", "why": "Split second kills an artifact or enchantment with no response, which matters against Equipment and Rhystic-style pieces. Giant Space Amoeba is a five-mana 3/3 flier whose attack trigger gives one blocker -3/-0 and copies itself."}, {"in": "Counterspell", "out": "Echo of Eons", "why": "Two mana stops the sweeper or the combo piece outright. Echo of Eons is a six-mana wheel that refills every opponent's hand too."}], "cost_usd": 3.19, "cost_eur": 1.98}, "directions": [{"id": "landfall", "name": "Land Engine", "recommended": true, "pitch": "The stock list has the payoffs and almost none of the enablers: ten cards trigger when a land enters and Exploration is the only card that lets you play an extra one. Loot, Azusa and Wayward Swordtooth turn one land drop into three or four, Mole Man replays lands from the graveyard, and Felidar Retreat and Rampaging Baloths are the two payoffs worth adding on top of the ten already there. Same six slots, four times the triggers.", "plays_like": "Three or four land drops a turn", "metrics": {"Spot removal": 6, "Board wipes": 2, "Instant-speed answers": 7, "Protection": 2, "Card draw": 10, "Ramp": 13, "Extra land drops": 4, "Landfall payoffs": 13, "Lands": 40, "Different land names": 35, "Game Changers": 0}, "how_to_play": {"summary": "Ramp to four, then land three or four times a turn and let thirteen payoffs convert every drop into bodies.", "sections": [{"title": "Turns 1\u20133", "points": ["Exploration or Loot on turn two is the strongest start in the deck: every land after it is a second trigger.", "Spend Farseek, Nature's Lore and Rampant Growth on differently named lands \u2014 the ramp and Spock's ceiling are the same resource.", "Do not cut a land drop for a four-drop; the engine wants lands on the battlefield, not more spells in hand."]}, {"title": "Turns 4\u20136", "points": ["With Azusa or Wayward Swordtooth online you are playing two to four lands a turn out of 40; empty your hand of lands before cracking fetches so nothing is stranded.", "Mole Man, Moloid Master doubles a fetch: play it, then replay the land from the graveyard for a second trigger and a second Moloid.", "Felidar Retreat is the flexible payoff \u2014 tokens when you are behind on board, counters when the ground is stable."]}, {"title": "Closing", "points": ["Rampaging Baloths plus two extra land drops is four 4/4 Beasts a round; the table has to answer the engine, not the individual Beasts.", "Spock is still a fine curve-topper and a free card every attack, but this build no longer needs him to win."]}]}, "swaps": [{"in": "Loot, Exuberant Explorer", "out": "Fleet Captain Christopher Pike", "why": "One extra land drop every turn, and once the land count catches up his second ability puts a creature from the top six straight onto the battlefield. Pike is a 0/6 that only taps and untaps other creatures."}, {"in": "Azusa, Lost but Seeking", "out": "Tribble Cluster", "why": "Two extra land drops turns every landfall trigger in the deck into three a turn. Tribble Cluster is a 1/1 that needs four combat steps before it is worth a card."}, {"in": "Wayward Swordtooth", "out": "Sam Kirk, Xenoanthropologist", "why": "A third extra land drop with a 5/5 body attached \u2014 the city's blessing only gates attacking, the land drops work from turn three. Sam Kirk only investigates when an opponent casts a creature spell, one Clue at a time."}, {"in": "Mole Man, Moloid Master", "out": "Colossal Clone Master", "why": "Enabler and payoff in one card: lands played from the graveyard bring fetches back for a second trigger, and every land still makes a Moloid. Colossal Clone Master is the deck's best name-count payoff, but at six mana it is a copy of something already on the battlefield and does nothing for the engine \u2014 the fairest cut once there are thirteen payoffs."}, {"in": "Felidar Retreat", "out": "Temporal Tribulation", "why": "With three extra land drops this makes a 2/2 per land, or grows the whole team when the board is stable. Temporal Tribulation was a two-permanent blink that doubled as protection \u2014 real value, but this build spends its safety budget on the engine."}, {"in": "Rampaging Baloths", "out": "Balance of Terror", "why": "A 6/6 trampler that makes a 4/4 on every land drop \u2014 four Beasts a round with this shell. Generous Gift covers the artifact/enchantment answer, and Balance of Terror only destroyed one at chapter I while chapters II and III blinked your own permanents."}], "curve": {"buckets": {"0": 0, "1": 7, "2": 12, "3": 16, "4": 12, "5": 5, "6": 6, "7+": 1}, "average": 3.31, "nonland": 59}, "cost_usd": 22.12, "cost_eur": 16.21, "out_value_usd": 49.57, "out_value_eur": 10.04, "game_changers": []}, {"id": "cheat", "name": "Strange New Worlds", "recommended": false, "pitch": "Spock's trigger is only as good as the top card, and the stock list cannot choose it, protect him, or get him past a blocker. Penance puts a card from your hand on top for free at instant speed; Case of the Locked Hothouse gives permanent top-deck information and a second way to cast off the top; Aqueous Form makes him unblockable and scries before his own trigger resolves; Swiftfoot Boots answers the first removal spell. Terastodon and Hornet Queen are what you cast for free.", "plays_like": "A chosen free cast every combat", "metrics": {"Spot removal": 6, "Board wipes": 2, "Instant-speed answers": 7, "Protection": 3, "Card draw": 10, "Ramp": 11, "Extra land drops": 2, "Landfall payoffs": 10, "Lands": 40, "Different land names": 35, "Game Changers": 0}, "how_to_play": {"summary": "Choose the top card, keep Spock alive, attack, and cast something expensive for nothing.", "sections": [{"title": "Turns 1\u20133", "points": ["Swiftfoot Boots on two, Spock on four, equip and attack the same turn \u2014 haste means the trigger happens before they have mana up.", "Case of the Locked Hothouse on four is the quieter line: an extra land drop now, and from seven lands you cast creatures and enchantments off the top yourself.", "Hold Swords to Plowshares and Generous Gift; this is the slowest of the three builds and it wants the long game."]}, {"title": "Turns 4\u20136", "points": ["Before combat, put your best expensive card back on top with Penance \u2014 the ability is free, so do it every turn, not only when damage is coming.", "Aqueous Form's scry is also an attack trigger: put Spock's trigger on the stack first and the scry resolves before it, so you fix the top you are about to reveal.", "Hexproof from the Boots matters for the same reason \u2014 you can still enchant him afterwards, which shroud would not allow."]}, {"title": "Closing", "points": ["Two triggers a round \u2014 enter and attack \u2014 is the plan; at seven or eight names Terastodon and Hornet Queen cost nothing.", "Do not tap out for a six-drop you could have cast for free; hold mana for the counterspell you drew into."]}]}, "swaps": [{"in": "Penance", "out": "Fleet Captain Christopher Pike", "why": "The missing piece of the commander: putting a card from your hand on top of your library is the only way in the deck to decide what Spock reveals, and the ability costs nothing. Pike only untaps creatures."}, {"in": "Case of the Locked Hothouse", "out": "Tribble Cluster", "why": "An extra land drop plus permanent top-deck information, and once solved at seven lands you cast creatures and enchantments from the top without Spock. Tribble Cluster needs four combat steps to be worth a card."}, {"in": "Aqueous Form", "out": "Sam Kirk, Xenoanthropologist", "why": "Spock is a 3/5 with no evasion, so one blocker blanks the whole trigger. Unblockable plus scry 1 on attack fixes both halves of the problem for one mana. Sam Kirk only makes a Clue off an opponent's creature spell."}, {"in": "Swiftfoot Boots", "out": "Colossal Clone Master", "why": "Hexproof and haste for two mana: the first removal spell fizzles and he swings the turn he lands. Colossal Clone Master copies something already on the battlefield; Spock's package needs protection, not another copy."}, {"in": "Terastodon", "out": "Temporal Tribulation", "why": "Eight mana, castable for free at eight names, and it answers three noncreature permanents while leaving 3/3s on the other side. Swiftfoot Boots takes over the protection role that Temporal Tribulation covered, permanently rather than once."}, {"in": "Hornet Queen", "out": "Balance of Terror", "why": "Seven mana for five evasive deathtouchers, free off the top at seven names \u2014 the best rate in the deck for Spock's trigger. Generous Gift replaces Balance of Terror's single artifact/enchantment destruction, and this build does not want a saga that blinks its own permanents."}], "curve": {"buckets": {"0": 0, "1": 8, "2": 13, "3": 13, "4": 12, "5": 5, "6": 5, "7+": 3}, "average": 3.36, "nonland": 59}, "cost_usd": 13.2, "cost_eur": 8.76, "out_value_usd": 49.57, "out_value_eur": 10.04, "game_changers": []}, {"id": "worlds", "name": "More Worlds", "recommended": false, "pitch": "Push the resource Spock actually counts: 43 lands and 38 different names, cutting the colourless lands that were doing nothing in a three-colour deck. Cheapest direction and the most direct upgrade to the commander.", "plays_like": "43 lands, 38 names", "metrics": {"Spot removal": 6, "Board wipes": 2, "Instant-speed answers": 7, "Protection": 3, "Card draw": 10, "Ramp": 10, "Extra land drops": 1, "Landfall payoffs": 10, "Lands": 43, "Different land names": 38, "Game Changers": 0}, "how_to_play": {"summary": "Trade clunky permanents for lands, then let the name count carry Spock.", "sections": [{"title": "Turns 1\u20133", "points": ["Play the untapped duals first (Brushland, Adarkar Wastes, Yavimaya Coast) so the name count grows without costing tempo; the pain is one life per coloured use.", "Keep the four Forest, two Island, two Plains for Rampant Growth, Cultivate and Kirk to find."]}, {"title": "Turns 4\u20136", "points": ["Every new name raises Spock's free-cast ceiling, so a six-drop on top becomes castable at six lands rather than eight.", "Exploration plus 43 lands means two drops a turn is normal; do not be shy about playing lands you do not immediately need."]}, {"title": "Closing", "points": ["At 38 names Spock casts almost anything on top for free; attack with him every turn to trigger it twice per round.", "You are at 43 lands with eight basics \u2014 keep two spare lands in hand for Exploration turns, and check your remaining basics before cracking Evolving Wilds."]}]}, "swaps": [{"in": "Brushland", "out": "Temple of the False God", "why": "An untapped green-white source with a new name for one life per coloured use. Temple of the False God is colourless and only taps once you control five lands."}, {"in": "Adarkar Wastes", "out": "Mutavault", "why": "Untapped white-blue fixing and a brand-new name. Mutavault is a colourless 2/2 that does not help you cast anything; this direction trades it up."}, {"in": "Yavimaya Coast", "out": "Shore Leave Planet", "why": "Untapped green-blue fixing for a land that only made blue and charged four mana to copy a creature."}, {"in": "Razorverge Thicket", "out": "Fleet Captain Christopher Pike", "why": "Trades a 0/6 that only taps creatures for a land that enters untapped early and adds a name. The deck goes to 43 lands, so every drop matters."}, {"in": "Seachrome Coast", "out": "Tribble Cluster", "why": "A white-blue fast land with a new name instead of a 1/1 that needs four combat steps before it is a real threat."}, {"in": "Radiant Grove", "out": "Sam Kirk, Xenoanthropologist", "why": "Green-white fixing and a new name for a 3/3 that only investigates when an opponent casts a creature spell."}], "curve": {"buckets": {"0": 0, "1": 7, "2": 12, "3": 14, "4": 11, "5": 5, "6": 6, "7+": 1}, "average": 3.3, "nonland": 56}, "cost_usd": 5.14, "cost_eur": 5.09, "out_value_usd": 53.48, "out_value_eur": 13.83, "game_changers": []}], "recommendation": "Take Land Engine. It fixes a structural problem rather than a weak card: ten payoffs were firing off a single extra land drop, and four enablers at about \u20ac16 all in (shared answers included) quadruple the triggers without depending on the commander, so a table that kills Spock twice does not turn the deck off. Strange New Worlds is the pick if you want Spock to be the win condition \u2014 it is the cheaper engine at about \u20ac7 and it is the only one that makes the commander reliable, but it folds if he is answered twice. More Worlds stays the safest long-term mana base, and it is the only direction that adds no new payoffs.", "commanders": ["Commander Spock"], "stock_curve": {"buckets": {"0": 0, "1": 6, "2": 11, "3": 14, "4": 12, "5": 6, "6": 8, "7+": 2}, "average": 3.58, "nonland": 59}, "cards": {"temple of the false god": {"name": "Temple of the False God", "cmc": 0.0, "type_line": "Land", "mana_cost": "", "game_changer": false, "usd": 0.16, "eur": 0.09, "usd_set": "Fo usd_set": "Final Fantasy Commander", "eur_set": "Final Fantasy Commander"}, "echo of eons": {"usd": 9.73, "eur": 10.04, "usd_set": "Mystery Booster 2", "eur_set": "Mystery Booster 2"}, "shore leave planet": {"usd": null, "eur": null, "usd_set": null, "eur_set": null}, "giant space amoeba": {"usd": null, "eur": null, "usd_set": null, "eur_set": null}, "seachrome coast": {"usd": 0.38, "eur": 0.78, "usd_set": "Bloomburrow Commander", "eur_set": "Bloomburrow Commander"}, "aqueous form": {"usd": 0.3, "eur": 0.29, "usd_set": "Commander Legends", "eur_set": "The List"}, "sam kirk, xenoanthropologist": {"usd": null, "eur": null, "usd_set": null, "eur_set": null}, "commander spock": {"usd": 9.73, "eur": null, "usd_set": "Star Trek Commander", "eur_set": null}}, "generated": "2026-11-01", "prices_as_of": "2026-10-31", "curve_buckets": ["0", "1", "2", "3", "4", "5", "6", "7+"]}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const k = n => n.trim().toLowerCase();
  const card = n => D.cards[k(n)] || null;
  const price = n => D.prices[k(n)] || {};
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = (v, sym) => v == null ? "—" : sym + v.toFixed(2);
  const both = (u, e) => `${money(u, "$")} · ${money(e, "€")}`;
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-");

  document.title = D.title || "Deck Upgrade Comparison";

  function cardHTML(name, role) {
    const c = card(name), p = price(name);
    const img = c && c.images[0] && c.images[0].normal
      ? `<img loading="lazy" src="${esc(c.images[0].normal)}" alt="${esc(name)}" data-name="${esc(name)}">`
      : `<div class="name-fallback">${esc(name)}</div>`;
    const mv = c ? `MV ${c.cmc}` : "";
    const link = c && c.scryfall_uri ? `<a href="${esc(c.scryfall_uri)}" target="_blank" rel="noopener">${mv || "Scryfall"}</a>` : mv;
    const tip = [p.usd_set && `cheapest $: ${p.usd_set}`, p.eur_set && `cheapest €: ${p.eur_set}`].filter(Boolean).join(" | ");
    return `<div class="card ${role}">${img}<span class="tag">${role.toUpperCase()}</span>
      <div class="meta"><span class="muted">${link}</span><span class="price" title="${esc(tip)}">${both(p.usd, p.eur)}</span></div></div>`;
  }

  function curveHTML(buckets, ghost, max) {
    return `<div class="curve">${D.curve_buckets.map(b => {
      const v = buckets[b], g = ghost ? ghost[b] : null;
      const h = x => (x / max * 100).toFixed(1) + "%";
      const diff = g != null && g !== v ? ` <span class="muted">(${v > g ? "+" : ""}${v - g})</span>` : "";
      return `<div class="col"><div class="bars">
        ${g != null ? `<div class="ghost" style="height:${h(g)}"></div>` : ""}
        <div class="fill" style="height:${h(v)}"></div>
        <div class="val" style="bottom:calc(${h(Math.max(v, g ?? 0))} + 1px)">${v}${diff}</div>
      </div><div class="lbl">${b}</div></div>`;
    }).join("")}</div>`;
  }

  function swapsHTML(swaps) {
    return `<div class="swaps">${swaps.map(s => `
      <div class="swap"><div class="pair">${cardHTML(s.out, "out")}<div class="arrow">→</div>${cardHTML(s.in, "in")}</div>
      ${s.why ? `<div class="why">${esc(s.why)}</div>` : ""}</div>`).join("")}</div>`;
  }

  // Buy list for one direction (core package + its own swaps), Cardmarket Wants format
  function buyHTML(d) {
    const core = (D.core && D.core.swaps) || [];
    const items = [...core.map(s => ({ ...s, part: D.core.name })), ...d.swaps.map(s => ({ ...s, part: d.name }))]
      .map(s => ({ ...s, p: price(s.in) }))
      .sort((a, b) => (b.p.eur ?? 0) - (a.p.eur ?? 0));
    const text = items.map(s => `1 ${s.in}`).join("\n");
    const budget = D.budget_eur != null ? ` · budget €${D.budget_eur}` : D.budget_usd != null ? ` · budget $${D.budget_usd}` : "";
    return `<details class="buy"${d.picked ? " open" : ""}>
      <summary><span class="t">🛒 Buy list: ${items.length} cards</span><span>${both(d.cost_usd, d.cost_eur)}${budget}</span></summary>
      <div class="body">
        <div class="table-scroll"><table>
          <tr><th>Card</th><th class="num">EUR</th><th class="num">USD</th><th>Replaces</th></tr>
          ${items.map(s => `<tr><td>${esc(s.in)}${s.part !== d.name ? ` <span class="muted small">(core)</span>` : ""}</td>
            <td class="num" title="${esc(s.p.eur_set || "")}">${money(s.p.eur, "€")}</td>
            <td class="num" title="${esc(s.p.usd_set || "")}">${money(s.p.usd, "$")}</td>
            <td class="small muted">${esc(s.out)}</td></tr>`).join("")}
          <tr><td><b>Total</b></td><td class="num"><b>${money(d.cost_eur, "€")}</b></td><td class="num"><b>${money(d.cost_usd, "$")}</b></td><td></td></tr>
        </table></div>
        <div>
          <div class="copy-row"><button class="copy" data-copy="buy-${slug(d.id || d.name)}">Copy list</button><span class="copied" hidden>Copied ✓</span></div>
          <textarea id="buy-${slug(d.id || d.name)}" readonly>${esc(text)}</textarea>
          <p class="small muted" style="margin-top:6px">Cardmarket: Wants → create a Magic list → <b>Add Deck List</b> → paste → <b>Add</b>, then run the <b>Shopping Wizard</b>. Also works for TCGplayer Mass Entry.</p>
        </div>
      </div></details>`;
  }

  // How-to-play guide for one direction (optional `how_to_play` in the spec)
  function htpHTML(d) {
    const g = d.how_to_play;
    if (!g) return "";
    return `<details class="buy htp"${d.picked ? " open" : ""}>
      <summary><span class="t">🎮 How to play</span><span class="muted small">${esc(g.summary || "")}</span></summary>
      <div class="htp-body">${(g.sections || []).map(sec => `<div class="htp-sec"><h4>${esc(sec.title)}</h4>
        <ul>${(sec.points || []).map(pt => `<li>${esc(pt)}</li>`).join("")}</ul></div>`).join("")}</div></details>`;
  }

  const dirs = D.directions;
  const stock = D.stock_curve;
  const maxBar = Math.max(...[stock, ...dirs.map(d => d.curve)].flatMap(c => Object.values(c.buckets))) + 2;
  const metricKeys = [...new Set(dirs.flatMap(d => Object.keys(d.metrics || {})))];
  const stockMetrics = (D.analysis && D.analysis.stock_metrics) || {};
  const cmd = D.commanders.map(card).filter(Boolean)[0];

  let h = "";
  h += `<header class="top">${cmd && cmd.images[0] ? `<img src="${esc(cmd.images[0].normal)}" alt="${esc(cmd.name)}" data-name="${esc(cmd.name)}">` : ""}
    <div><div class="muted small">${esc(D.deck)} · ${esc(D.date || "")}</div><h1>${esc(D.title)}</h1>
    ${D.summary ? `<p>${esc(D.summary)}</p>` : ""}
    <p class="muted small">Prices: cheapest paper printing on Scryfall (USD from TCGplayer, EUR from Cardmarket), Scryfall bulk data of ${esc(D.prices_as_of || "?")}. Hover a price to see which printing.</p></div></header>`;

  h += `<nav class="jump"><a href="#analysis">Stock analysis</a><a href="#compare">Comparison</a>
    ${D.core && D.core.swaps.length ? `<a href="#core">${esc(D.core.name)}</a>` : ""}
    ${dirs.map(d => `<a href="#${slug(d.id || d.name)}">${esc(d.name)}</a>`).join("")}</nav>`;

  // Stock analysis
  const A = D.analysis || {};
  h += `<h2 id="analysis">Stock deck analysis</h2><div class="grid2">
    <div class="panel"><h3>Mana curve <span class="muted small">· ${stock.nonland} nonland · avg MV ${stock.average}</span></h3>
      ${curveHTML(stock.buckets, null, maxBar)}
      ${A.notes ? `<ul class="notes" style="margin-top:12px">${A.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}</div>
    <div class="panel"><h3>Interaction & key categories</h3><div class="table-scroll"><table>
      <tr><th>Category</th><th class="num">Stock</th><th class="num">Target</th><th>Cards</th></tr>
      ${(A.interaction || []).map(r => `<tr><td>${esc(r.category)}</td><td class="num ${r.low ? "bad" : ""}">${esc(r.stock)}</td>
        <td class="num">${esc(r.target)}</td><td class="small muted">${esc((r.cards || []).join(", "))}</td></tr>`).join("")}
    </table></div></div></div>`;

  // Comparison
  h += `<h2 id="compare">Direction comparison</h2><div class="panel table-scroll"><table>
    <tr><th></th><th class="num">Stock</th>${dirs.map(d => `<th class="num">${esc(d.name)}${d.recommended ? ` <span class="rec">★</span>` : ""}${d.picked ? ` <span class="pill picked">✓ picked</span>` : ""}</th>`).join("")}</tr>
    <tr><td>Average MV (nonland)</td><td class="num">${stock.average}</td>${dirs.map(d => `<td class="num">${d.curve.average}</td>`).join("")}</tr>
    <tr><td>Cost of cards in</td><td class="num">—</td>${dirs.map(d => `<td class="num"><b>${both(d.cost_usd, d.cost_eur)}</b></td>`).join("")}</tr>
    <tr><td>Value of cards out</td><td class="num">—</td>${dirs.map(d => `<td class="num muted">${both(d.out_value_usd, d.out_value_eur)}</td>`).join("")}</tr>
    ${metricKeys.map(m => `<tr><td>${esc(m)}</td><td class="num">${esc(stockMetrics[m] ?? "")}</td>${dirs.map(d => `<td class="num">${esc((d.metrics || {})[m] ?? "")}</td>`).join("")}</tr>`).join("")}
    <tr><td>Plays like</td><td></td>${dirs.map(d => `<td class="small">${esc(d.plays_like || "")}</td>`).join("")}</tr>
    </table>${D.core && D.core.swaps.length ? `<p class="small muted" style="margin-top:8px">Costs include the ${esc(D.core.name)} (${both(D.core.cost_usd, D.core.cost_eur)}).</p>` : ""}</div>`;

  h += `<div class="curves" style="margin-top:16px">${dirs.map(d => `<div class="panel"><h3>${esc(d.name)} <span class="muted small">avg ${d.curve.average}</span></h3>
    ${curveHTML(d.curve.buckets, stock.buckets, maxBar)}</div>`).join("")}</div>
    <div class="legend"><span class="l-fill">after swaps</span><span class="l-ghost">stock</span></div>`;
  if (D.recommendation) h += `<div class="panel" style="margin-top:16px"><b class="rec">★ Recommendation.</b> ${esc(D.recommendation)}</div>`;

  // Core package
  if (D.core && D.core.swaps.length) {
    h += `<section class="dir" id="core"><div class="dir-head"><h2 style="margin:0">${esc(D.core.name)}<span class="pill">all directions</span></h2>
      <div class="totals">In: <b>${both(D.core.cost_usd, D.core.cost_eur)}</b></div></div>
      ${D.core.description ? `<p class="muted">${esc(D.core.description)}</p>` : ""}${swapsHTML(D.core.swaps)}</section>`;
  }

  // Directions
  for (const d of dirs) {
    h += `<section class="dir" id="${slug(d.id || d.name)}"><div class="dir-head">
      <h2 style="margin:0">${esc(d.name)}${d.picked ? `<span class="pill picked">✓ picked</span>` : ""}${d.recommended ? `<span class="pill rec">★ recommended</span>` : ""}</h2>
      <div class="totals">Direction swaps + core: <b>${both(d.cost_usd, d.cost_eur)}</b> · avg MV ${d.curve.average}</div></div>
      ${d.pitch ? `<p class="muted">${esc(d.pitch)}</p>` : ""}${buyHTML(d)}${htpHTML(d)}${swapsHTML(d.swaps)}</section>`;
  }

  h += `<footer>Card images and prices via <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>. Generated ${esc(D.generated)}. Rebuild with <code>python3 tools/build_comparison.py &lt;spec&gt;.json</code>.</footer>`;
  document.getElementById("app").innerHTML = h;

  // Lightbox: click any card image for the large scan (both faces for DFCs)
  const lb = document.getElementById("lightbox");
  // Copy buttons for buy lists (clipboard API, with a select+execCommand fallback for file:// pages)
  document.addEventListener("click", async e => {
    const btn = e.target.closest("button.copy");
    if (!btn) return;
    const ta = document.getElementById(btn.dataset.copy);
    try { await navigator.clipboard.writeText(ta.value); }
    catch { ta.select(); document.execCommand("copy"); }
    const ok = btn.parentElement.querySelector(".copied");
    ok.hidden = false; setTimeout(() => { ok.hidden = true; }, 1800);
  });

  document.addEventListener("click", e => {
    if (e.target.closest("#lightbox")) { lb.classList.remove("open"); lb.innerHTML = ""; return; }
    const img = e.target.closest("img[data-name]");
    if (!img) return;
    const c = card(img.dataset.name);
    lb.innerHTML = (c ? c.images : [{ large: img.src }]).map(i => `<img src="${esc(i.large || i.normal)}" alt="">`).join("");
    lb.classList.add("open");
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { lb.classList.remove("open"); lb.innerHTML = ""; } });
})();
</script>
</body>
</html>
