<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Upgrade Comparison</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #efede8; --text: #1d1c1a; --muted: #6b6862;
    --border: #dcd8d0; --accent: #4f46e5; --in: #15803d; --in-bg: #dcfce7; --out: #b91c1c; --out-bg: #fee2e2;
    --bar: #4f46e5; --bar-ghost: #c7c3ba; --star: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --surface: #1e1d1b; --surface-2: #2a2926; --text: #ecebe7; --muted: #a29f97;
      --border: #3a3834; --accent: #8b85ff; --in: #4ade80; --in-bg: #14321f; --out: #f87171; --out-bg: #3b1717;
      --bar: #8b85ff; --bar-ghost: #4a4843; --star: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --surface: #1e1d1b; --surface-2: #2a2926; --text: #ecebe7; --muted: #a29f97;
    --border: #3a3834; --accent: #8b85ff; --in: #4ade80; --in-bg: #14321f; --out: #f87171; --out-bg: #3b1717;
    --bar: #8b85ff; --bar-ghost: #4a4843; --star: #fbbf24;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h2 { font-size: 21px; margin: 40px 0 12px; }
  h3 { font-size: 17px; margin: 0 0 6px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  a { color: var(--accent); }

  header.top { display: flex; gap: 20px; align-items: flex-start; }
  header.top img { width: 150px; border-radius: 8px; flex: none; cursor: zoom-in; }
  nav.jump { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border);
    display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0; margin-top: 20px; }
  nav.jump a { text-decoration: none; padding: 4px 10px; border-radius: 999px; background: var(--surface-2);
    color: var(--text); font-size: 13px; }
  nav.jump a:hover { background: var(--accent); color: #fff; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  ul.notes { margin: 0; padding-left: 18px; }
  ul.notes li { margin-bottom: 4px; }

  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table-scroll { overflow-x: auto; }
  .bad { color: var(--out); font-weight: 600; }
  .rec { color: var(--star); font-weight: 600; }

  .curve { display: flex; align-items: flex-end; gap: 4px; height: 110px; padding-top: 14px; }
  .curve .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .curve .bars { position: relative; width: 100%; flex: 1; }
  .curve .ghost, .curve .fill { position: absolute; bottom: 0; border-radius: 3px 3px 0 0; }
  .curve .ghost { left: 0; right: 0; border: 1.5px dashed var(--bar-ghost); border-bottom: none; }
  .curve .fill { left: 18%; right: 18%; background: var(--bar); }
  .curve .val { font-size: 11px; font-variant-numeric: tabular-nums; position: absolute; left: 0; right: 0; text-align: center; }
  .curve .lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .legend { font-size: 12px; color: var(--muted); display: flex; gap: 14px; margin-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; }
  .legend .l-fill::before { background: var(--bar); }
  .legend .l-ghost::before { border: 1.5px dashed var(--bar-ghost); }

  .curves { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }

  section.dir { margin-top: 44px; }
  .dir-head { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); margin-left: 6px; }
  .pill.rec { background: var(--star); color: #fff; }

  .swaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; margin-top: 14px; }
  .swap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .swap .pair { display: grid; grid-template-columns: 1fr 22px 1fr; align-items: center; gap: 6px; }
  .swap .arrow { text-align: center; color: var(--muted); font-size: 18px; }
  .swap .why { font-size: 13px; margin-top: 10px; color: var(--text); }
  .card { position: relative; }
  .card img { width: 100%; display: block; border-radius: 4.75% / 3.5%; cursor: zoom-in; background: var(--surface-2); aspect-ratio: 488/680; }
  .card.out img { filter: grayscale(.55) brightness(.9); }
  .card .tag { position: absolute; top: 6px; left: 6px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; letter-spacing: .04em; }
  .card.in .tag { background: var(--in-bg); color: var(--in); }
  .card.out .tag { background: var(--out-bg); color: var(--out); }
  .card .meta { font-size: 12px; margin-top: 5px; display: flex; justify-content: space-between; gap: 6px; }
  .card .meta .price { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .card .name-fallback { aspect-ratio: 488/680; border: 1px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; font-weight: 600; }
  .totals { font-size: 14px; margin-top: 10px; }
  .pill.picked { background: var(--in-bg); color: var(--in); font-weight: 600; }
  .pill.gc { background: var(--star); color: #fff; font-weight: 600; }
  .swap .flags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .swap .flags .pill { margin-left: 0; }
  details.buy { margin-top: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  details.buy[open] { border-color: var(--accent); }
  details.buy summary { cursor: pointer; padding: 12px 16px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  details.buy summary::-webkit-details-marker { display: none; }
  details.buy summary::before { content: "▸"; margin-right: 6px; color: var(--muted); }
  details.buy[open] summary::before { content: "▾"; }
  details.buy summary .t { flex: 1; }
  details.buy .body { padding: 0 16px 16px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  details.buy textarea { width: 100%; min-height: 240px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; resize: vertical; }
  .copy-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  button.copy { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer; }
  button.copy:hover { filter: brightness(1.1); }
  .copied { font-size: 13px; color: var(--in); }
  details.htp summary .muted { flex-basis: 100%; font-weight: 400; margin-left: 18px; }
  .htp-body { padding: 0 16px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px 24px; }
  .htp-sec h4 { margin: 4px 0 6px; font-size: 14px; }
  .htp-sec ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .htp-sec li { margin-bottom: 4px; }
  @media (max-width: 720px) { details.buy .body { grid-template-columns: 1fr; } }

  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; gap: 12px; z-index: 50; padding: 16px; cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img { max-height: 90vh; max-width: min(46vw, 488px); border-radius: 18px; }
  #lightbox img:only-child { max-width: 92vw; }

  footer { margin-top: 50px; font-size: 12px; color: var(--muted); }
  @media (max-width: 720px) {
    header.top { flex-direction: column; }
    header.top img { width: 120px; }
    .grid2 { grid-template-columns: 1fr; }
    .swaps { grid-template-columns: 1fr; }
  }
</style>
</head>

<script id="data" type="application/json">{"title": "Mutant Menace \u2014 Upgrade Options", "deck": "decks/precon/mutant-menace.md", "date": "2026-10-16", "budget_eur": 20, "summary": "The Wise Mothman puts +1/+1 counters on creatures whenever nonland cards are milled from any library, and its rad counters make every player mill each turn. A shared removal package fixes the stock list's thin interaction; each direction then spends 6 more swaps on one plan. Budget: up to \u20ac20 per deck in total (Cardmarket prices).", "analysis": {"notes": ["Curve shape is fine for a 4-mana commander, but several 2-drops (Power Fist, Nuka-Nuke Launcher, Biomass Mutation) don't affect the board.", "Lumbering Megasloth (MV 12) and Agent Frank Horrigan (MV 7) are the clunkiest cards at the top.", "Mana is fine: 39 lands + ~8 ramp. Many lands enter tapped (Temples, Opulent Palace, Tainted lands); improving them is a separate project.", "Biggest weakness: only 5 spot removal and just 2 instant-speed answers.", "Engine ledger \u2014 enablers: Ruin Crab, Mindcrank and the rad counters Mothman hands out all mill; payoffs: Mothman turns each nonland mill into +1/+1 counters, Kami of Whispered Hopes adds one to each, Evolution Sage proliferates on landfall and Evolution Witness buys permanents back. Support: the four removal instants. The mill half is genuinely self-feeding \u2014 rad's life loss feeds Mindcrank, which mills again.", "The throttled half: Ruin Crab and Evolution Sage are landfall triggers and the deck plays exactly zero extra land drops, so each fires once a turn. Two extra-drop enablers (Loot, Exuberant Explorer \u20ac1.47 and Oracle of Mul Daya \u20ac2.58) would roughly double both cards for about \u20ac4 \u2014 the only purchase worth making in this deck.", "Win conditions (finishers in the 99, counted by the deck-comparison skill's rule): big threats \u2014 Alpha Deathclaw, Screeching Scorchbeast, Strong, the Brutish Thespian, Agent Frank Horrigan, Lumbering Megasloth, Lily Bowen, Raging Grandma, Bloatfly Swarm, Rampaging Yao Guai; team closers \u2014 Biomass Mutation, Vault 12: The Necropolis; mill \u2014 Fraying Sanity."], "interaction": [{"category": "Win conditions", "stock": 11, "target": "5\u20138, across 2+ routes", "cards": ["Rampaging Yao Guai", "Bloatfly Swarm", "Lily Bowen, Raging Grandma", "Alpha Deathclaw", "Screeching Scorchbeast", "Strong, the Brutish Thespian", "Agent Frank Horrigan", "Lumbering Megasloth", "Biomass Mutation", "Fraying Sanity", "Vault 12: The Necropolis"]}, {"category": "Spot removal", "stock": 5, "target": "8\u201310", "low": true, "cards": ["Putrefy", "Atomize", "Alpha Deathclaw", "Casualties of War", "Rampaging Yao Guai"]}, {"category": "Board wipes", "stock": 2, "target": "2\u20133", "cards": ["Nuclear Fallout", "Find // Finality"]}, {"category": "Instant-speed answers", "stock": 2, "target": "5+", "low": true, "cards": ["Putrefy", "Atomize"]}, {"category": "Protection", "stock": 2, "target": "2\u20133", "cards": ["Inspiring Call", "Mutational Advantage"]}, {"category": "Card draw", "stock": 9, "target": "8\u201310", "cards": ["Tireless Tracker", "Mirelurk Queen", "Marcus, Mutant Mayor", "Guardian Project", "Harmonize", "Contaminated Drink", "Struggle for Project Purity", "Vault 87: Forced Evolution", "Piper Wright, Publick Reporter"]}, {"category": "Ramp", "stock": 8, "target": "8\u201310", "cards": ["Sol Ring", "Arcane Signet", "3 Talismans", "Farseek", "Rampant Growth", "Cultivate"]}], "stock_metrics": {"Win conditions": 11, "Spot removal": 5, "Instant-speed answers": 2, "Card draw": "~9", "Game Changers": 0, "Lands": 39, "Different land names": 27, "Extra land drops": 0, "Landfall payoffs": 2}}, "core": {"name": "Core interaction package", "description": "Four cheap instants that go in whichever direction you choose. Spot removal goes from 5 to 9, with 6 at instant speed.", "swaps": [{"in": "Assassin's Trophy", "out": "Lumbering Megasloth", "why": "Instant: destroy any permanent an opponent controls, for 2 mana. Megasloth costs 12 minus the counters in play, which you can rarely make cheap."}, {"in": "Heartless Act", "out": "Biomass Mutation", "why": "Kill a creature, or remove 3 counters from one. Biomass is a combat trick that mostly duplicates what your counters already do."}, {"in": "Beast Within", "out": "Strength Bobblehead", "why": "Instant: destroy any permanent; its controller gets a 3/3. Bobblehead is a 3-mana rock whose counter ability is slow."}, {"in": "Sultai Charm", "out": "Recon Craft Theta", "why": "Flexible: destroy a monocoloured creature, an artifact or an enchantment, or draw 2 and discard 1. Theta fits the theme but needs crewing; this was the closest cut."}], "cost_usd": 1.81, "cost_eur": 2.0}, "directions": [{"id": "counters", "name": "Counter Engine", "recommended": true, "pitch": "Mill every opponent every turn and turn each mill into +1/+1 counters. Ruin Crab and Mindcrank make rad counters and combat damage mill again; Kami and Evolution Sage grow everything further; Evolution Witness and Struggle for Project Purity keep the cards coming; Radstorm stays as a proliferate finisher.", "plays_like": "Big creatures attacking; draws lots of cards", "metrics": {"Win conditions": 11, "Spot removal": 9, "Instant-speed answers": 6, "Card draw": "good (Evolution Witness, Mirelurk Queen, Marcus)", "Game Changers": 0, "Lands": 39, "Different land names": 27, "Extra land drops": 0, "Landfall payoffs": 4}, "swaps": [{"in": "Ruin Crab", "out": "Cathedral Acolyte", "why": "Each land you play mills each opponent 3. Simultaneous mills trigger Mothman once, counting every nonland card milled, so that's counters on about 6 creatures per land drop. Acolyte's ward 1 is a small effect."}, {"in": "Kami of Whispered Hopes", "out": "Power Fist", "why": "+1 extra counter on every placement, and it taps for mana equal to its power, so Mothman's counters turn it into a big mana source. Power Fist needs equip mana and a successful hit."}, {"in": "Evolution Witness", "out": "Nuka-Nuke Launcher", "why": "Whenever it gets +1/+1 counters (Mothman does that constantly), return a permanent card from your graveyard to your hand. Repeatable card advantage. The Launcher's equip 3 is too expensive."}, {"in": "Evolution Sage", "out": "Watchful Radstag", "why": "Proliferates on every land drop: more +1/+1 counters on your creatures and more rad counters on opponents. Watchful Radstag only copies itself when a bigger creature enters; Mothman's counters don't count."}, {"in": "Mindcrank", "out": "Piper Wright, Publick Reporter", "why": "Whenever an opponent loses life, they mill that many cards. Rad-counter mills already cost life, so every rad mill and every combat hit mills again, and each mill is another Mothman trigger. Piper only does anything when she deals combat damage."}, {"in": "Yavimaya Coast", "out": "Overflowing Basin", "why": "Land swap. Untapped green or blue on its own. Overflowing Basin can't make mana by itself ({1},{T} only)."}, {"in": "Llanowar Wastes", "out": "Viridescent Bog", "why": "Land swap. Untapped black or green on its own. Viridescent Bog can't make mana by itself ({1},{T} only)."}, {"in": "Underground River", "out": "Temple of the False God", "why": "Land swap. Untapped blue or black. Temple of the False God only makes colourless mana, and only with five lands out."}], "picked": true, "how_to_play": {"summary": "Make every player mill every turn. Each mill puts +1/+1 counters on your creatures, so your board grows until you win in combat or by emptying their libraries.", "sections": [{"title": "How Mothman and rad counters work", "points": ["Mothman: when it enters or attacks, each player gets a rad counter. Whenever nonland cards are milled, put a +1/+1 counter on each of up to X creatures (X = nonland cards milled). Several players milling at once triggers Mothman once, counting all of them.", "Rad counters: at the start of each player's first main phase they mill one card per rad counter, lose 1 life per nonland card milled and remove one rad counter per nonland card. Milled lands don't remove counters."]}, {"title": "Turns 1\u20133: mill sources and ramp", "points": ["Ruin Crab: each land you play mills every opponent 3.", "Mindcrank: whenever an opponent loses life, they mill that many, so rad life loss and combat damage mill again.", "Ramp: Talismans, Farseek, Rampant Growth."]}, {"title": "Turn 4: Mothman", "points": ["Every player's rad mill now triggers Mothman, on every player's turn.", "Spread counters, evasive creatures first: Mothman (flying), Nightkin Ambusher, Infesting Radroach."]}, {"title": "Keeping rad counters going", "points": ["Engines: Evolution Sage proliferates on every land drop and Inexorable Tide on every spell. Protect them.", "Attack triggers: Mothman (each player +1) and Screeching Scorchbeast (each player +2) when they attack. Hitting a player: Glowing One (+4), Infesting Radroach (+damage dealt), Vexing Radgull (+2 or proliferate).", "Bursts: Nightkin Ambusher (+4), The Master and Mirelurk Queen (+2), Vault 12 (each player +3), Nuclear Fallout (+X each), Feral Ghoul on death, Bloatfly Swarm when damaged.", "When you proliferate, add to opponents and skip yourself unless you want the mill."]}, {"title": "Engines and card draw", "points": ["Boosters: Hardened Scales, Kami of Whispered Hopes, Winding Constrictor; doublers: Corpsejack Menace, Branching Evolution.", "Struggle for Project Purity (choose Brotherhood): about 3 cards each upkeep. Opponents drawing is fine; you're milling them out anyway.", "Mirelurk Queen, Marcus, Guardian Project; Evolution Witness returns a permanent from your graveyard each time it gets counters.", "Fraying Sanity: curse the opponent who mills the most; they mill again at end of turn, which is another Mothman trigger."]}, {"title": "Your turn and tips", "points": ["Rad mills happen at the start of your first main phase, so counters arrive before combat. Play your land before combat (Ruin Crab, Evolution Sage), then attack with Mothman.", "You get rad counters too: watch your library and life, especially with Harold and Bob, Tato Farmer and Contaminated Drink. Strong makes you gain life from radiation instead.", "Nuclear Fallout gives each creature \u22122X/\u22122X; your counter-loaded creatures often survive.", "Use the instant-speed removal (Assassin's Trophy, Beast Within, Sultai Charm) at the end of an opponent's turn or in response to a threat.", "Mulligan hands without 3+ lands and some ramp; you want Mothman on turn 4."]}]}, "curve": {"buckets": {"0": 0, "1": 3, "2": 14, "3": 21, "4": 11, "5": 4, "6": 5, "7+": 2}, "average": 3.38, "nonland": 60}, "cost_usd": 18.72, "cost_eur": 17.95, "out_value_usd": 18.19, "out_value_eur": 16.0, "game_changers": []}, {"id": "mill", "name": "Mill Them Out", "pitch": "Empty opponents' libraries while their rad counters drain their life. Mothman's counters give you a combat plan as backup.", "plays_like": "Quiet early, then decks the table", "metrics": {"Win conditions": 13, "Spot removal": 9, "Instant-speed answers": 6, "Card draw": "good (draws trigger mill)", "Game Changers": 0, "Lands": 39, "Different land names": 27, "Extra land drops": 0, "Landfall payoffs": 4}, "swaps": [{"in": "Ruin Crab", "out": "Cathedral Acolyte", "why": "Each land you play mills every opponent 3."}, {"in": "Hedron Crab", "out": "Power Fist", "why": "A second land-mill Crab. Power Fist does nothing for a mill plan."}, {"in": "The Water Crystal", "out": "Harold and Bob, First Numens", "why": "Every time an opponent mills, they mill 4 more, and its activated ability mills each opponent your hand size. A budget Bruvac ($3 instead of $41). Harold and Bob gives you rad counters, the wrong direction."}, {"in": "Sphinx's Tutelage", "out": "Watchful Radstag", "why": "Each card you draw mills an opponent 2, and it repeats if the milled cards share a colour. Radstag is inconsistent."}, {"in": "Psychic Corrosion", "out": "Strong, the Brutish Thespian", "why": "Each card you draw mills every opponent 2. Strong irradiates you, the opposite of this plan."}, {"in": "Syr Konrad, the Grim", "out": "Agent Frank Horrigan", "why": "{1}{B}: each player mills a card. Every creature card that hits a graveyard pings each opponent for 1. Mill and damage in one card. Frank is strong but costs 7."}], "how_to_play": {"summary": "Empty opponents' libraries while their rad counters drain their life; Mothman's counters are the combat backup plan.", "sections": [{"title": "Game plan", "points": ["Ruin Crab and Hedron Crab: each land you play mills 3 (every opponent and one player respectively).", "Draw-to-mill: Sphinx's Tutelage (each card you draw mills an opponent 2, repeating on shared colours) and Psychic Corrosion (each card you draw mills each opponent 2).", "The Water Crystal: every opponent mill becomes mill +4. Syr Konrad: {1}{B} makes each player mill a card and pings opponents when creature cards hit graveyards."]}, {"title": "Tips", "points": ["Prioritise card draw: every card you draw is a mill with the Tutelages.", "Target the opponent with the smallest library first; one empty library means one player can't draw.", "Keep enough blockers: this version wins slowly and doesn't race well."]}]}, "curve": {"buckets": {"0": 0, "1": 4, "2": 15, "3": 19, "4": 12, "5": 5, "6": 4, "7+": 1}, "average": 3.27, "nonland": 60}, "cost_usd": 16.41, "cost_eur": 12.43, "out_value_usd": 20.47, "out_value_eur": 21.1, "game_changers": []}, {"id": "graveyard", "name": "Graveyard Value", "pitch": "Mill yourself on purpose, then replay what's in your graveyard. Your own mill still gives Mothman counters, and you can get back removal you've already used.", "plays_like": "Grinds out long games; hard to stop", "metrics": {"Win conditions": 7, "Spot removal": "9 (recurrable)", "Instant-speed answers": 6, "Card draw": "good", "Game Changers": 0, "Lands": 39, "Different land names": 27, "Extra land drops": 0, "Landfall payoffs": 2}, "swaps": [{"in": "Stitcher's Supplier", "out": "Vexing Radgull", "why": "Mills you 3 when it enters and 3 more when it dies, for 1 mana."}, {"in": "Undead Butler", "out": "Power Fist", "why": "Mills you 3, then can return a creature to your hand when it dies."}, {"in": "Eternal Witness", "out": "Fraying Sanity", "why": "Returns any card from your graveyard to your hand, including spent removal."}, {"in": "Teval's Judgment", "out": "Nuka-Nuke Launcher", "why": "Gives a card, a Treasure or a 2/2 Zombie whenever cards leave your graveyard."}, {"in": "Sidisi, Brood Tyrant", "out": "Radstorm", "why": "Mills you 3 when it enters or attacks, and makes a 2/2 Zombie whenever creatures are milled."}, {"in": "Muldrotha, the Gravetide", "out": "Agent Frank Horrigan", "why": "Each turn, replay a land and one permanent of each type from your graveyard."}], "how_to_play": {"summary": "Mill yourself on purpose, then replay creatures and permanents from the graveyard; your own mill still triggers Mothman.", "sections": [{"title": "Game plan", "points": ["Self-mill: Stitcher's Supplier (3 on enter and on death), Undead Butler (3, then returns a creature when it dies), Sidisi (3 on enter and attack, plus a Zombie when creatures are milled).", "Recursion: Muldrotha replays a permanent of each type from your graveyard every turn; Eternal Witness returns any card (including spent removal).", "Teval's Judgment gives a card, a Treasure or a Zombie whenever cards leave your graveyard."]}, {"title": "Tips", "points": ["Mill yourself before casting Muldrotha or Eternal Witness so the best targets are there.", "Watch for opponents' graveyard hate (e.g. Bojuka Bog): replay key pieces as soon as they hit your graveyard."]}]}, "win_conditions_note": "Cuts Fraying Sanity and Agent Frank Horrigan for recursion; Muldrotha replays the remaining threats from the graveyard, but that is fewer finishers than stock. Add one back if you pick it.", "curve": {"buckets": {"0": 0, "1": 3, "2": 15, "3": 20, "4": 11, "5": 4, "6": 6, "7+": 1}, "average": 3.35, "nonland": 60}, "cost_usd": 15.26, "cost_eur": 14.66, "out_value_usd": 23.23, "out_value_eur": 24.24, "game_changers": []}], "recommendation": "Counter Engine fits Mothman best: every mill trigger already gives counters, and these cards make each counter worth more. The removal package covers the deck's biggest weakness in every direction. All three directions stay under \u20ac20.", "played_deck": "decks/mutant-menace.md", "bracket3": {"name": "Bracket 3 package", "date": "2026-11-15", "rule": "Bracket 3 (Upgraded) allows up to three Game Changers, no mass land denial, no chained extra turns, and game-ending two-card combos only late in the game.", "budget_eur": 30, "description": "Mothman gets a trigger every time nonland cards are milled, by any player. This package makes mill happen constantly, turns milled creatures into damage, doubles your proliferate, adds a fourth way to win and gives the deck the counterspells it lacked.", "notes": ["Mesmeric Orb mills you too, about one card for each of your permanents that untaps. Play it when you can win within a few turns. Raul and The Master, Transcendent let you use what you mill.", "Mesmeric Orb and The Water Crystal together make each opponent mill five cards for every permanent they untap, which empties a library in two or three turns. That is the top end of bracket 3. Tell your table, and leave one of the two out if it is too much.", "Syr Konrad with Mindcrank or The Master of Lake-town can chain: damage makes opponents mill, and milled creatures make Konrad deal damage again. It often ends the game. Bracket 3 allows a late-game combo like this (Konrad costs five), but tell your table.", "Left out on purpose: Bloodchief Ascension. With Mindcrank it is a two-card infinite combo that can be ready on turn three or four. That is bracket 4 play."], "win_conditions": {"now": 11, "after": 16}, "swaps": [{"in": "Mesmeric Orb", "out": "Contagion Clasp", "why": "Whenever a permanent untaps, its controller mills a card. Each one is a separate mill, so Mothman triggers many times a turn, on every player's turn. In 62% of Mothman decks, the most-played card your list is missing. Contagion Clasp needs four mana for each proliferate."}, {"in": "The Master of Lake-town", "out": "Young Deathclaws", "why": "You already own it (Bulk pile). A second Mindcrank on a deathtouch body: any player who loses life mills that many cards, so every rad trigger and every attack feeds Mothman. Young Deathclaws is in 15% of Mothman decks.", "owned": true}, {"in": "Syr Konrad, the Grim", "out": "Jason Bright, Glowing Prophet", "why": "Deals 1 damage to each opponent for every creature card that is milled, by anyone. With four players milling every turn that is steady damage. In 51% of Mothman decks. Jason Bright (19%) needs your Mutants to die."}, {"in": "Tekuthal, Inquiry Dominus", "out": "Harold and Bob, First Numens", "why": "Every proliferate happens twice: rad counters on opponents and +1/+1 counters on your creatures both go up by two. A 3/5 flier for four. Harold and Bob is a 3/3 that turns into slow ramp when it dies."}, {"in": "The Water Crystal", "out": "Tireless Tracker", "why": "Whenever an opponent would mill, they mill four more cards. Rad counters, Ruin Crab, Mindcrank and Mesmeric Orb all get the bonus, which makes running the table out of cards a real way to win. Tireless Tracker is in 10% of Mothman decks."}, {"in": "Counterspell", "out": "Hancock, Ghoulish Mayor", "why": "The deck had no counterspell. Two mana stops a board wipe or a combo, and bracket 3 tables play both. Hancock (32%) only pumps Zombies and Mutants, and only once it has counters."}, {"in": "Drown in the Loch", "out": "Casualties of War", "why": "Two mana at instant speed: counter a spell or destroy a creature whose mana value is no more than the number of cards in its controller's graveyard. In this deck graveyards fill within a few turns. Casualties of War costs six at sorcery speed."}, {"in": " <script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const k = n => n.trim().toLowerCase();
  const card = n => D.cards[k(n)] || null;
  const price = n => D.prices[k(n)] || {};
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = (v, sym) => v == null ? "—" : sym + v.toFixed(2);
  const both = (u, e) => `${money(u, "$")} · ${money(e, "€")}`;
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-");

  document.title = D.title || "Deck Upgrade Comparison";

  function cardHTML(name, role) {
    const c = card(name), p = price(name);
    const img = c && c.images[0] && c.images[0].normal
      ? `<img loading="lazy" src="${esc(c.images[0].normal)}" alt="${esc(name)}" data-name="${esc(name)}">`
      : `<div class="name-fallback">${esc(name)}</div>`;
    const mv = c ? `MV ${c.cmc}` : "";
    const link = c && c.scryfall_uri ? `<a href="${esc(c.scryfall_uri)}" target="_blank" rel="noopener">${mv || "Scryfall"}</a>` : mv;
    const tip = [p.usd_set && `cheapest $: ${p.usd_set}`, p.eur_set && `cheapest €: ${p.eur_set}`].filter(Boolean).join(" | ");
    return `<div class="card ${role}">${img}<span class="tag">${role.toUpperCase()}</span>
      <div class="meta"><span class="muted">${link}</span><span class="price" title="${esc(tip)}">${both(p.usd, p.eur)}</span></div></div>`;
  }

  function curveHTML(buckets, ghost, max) {
    return `<div class="curve">${D.curve_buckets.map(b => {
      const v = buckets[b], g = ghost ? ghost[b] : null;
      const h = x => (x / max * 100).toFixed(1) + "%";
      const diff = g != null && g !== v ? ` <span class="muted">(${v > g ? "+" : ""}${v - g})</span>` : "";
      return `<div class="col"><div class="bars">
        ${g != null ? `<div class="ghost" style="height:${h(g)}"></div>` : ""}
        <div class="fill" style="height:${h(v)}"></div>
        <div class="val" style="bottom:calc(${h(Math.max(v, g ?? 0))} + 1px)">${v}${diff}</div>
      </div><div class="lbl">${b}</div></div>`;
    }).join("")}</div>`;
  }

  function swapsHTML(swaps) {
    const flags = s => [(card(s.in) || {}).game_changer && `<span class="pill gc">Game Changer</span>`,
      s.owned && `<span class="pill picked">already owned</span>`,
      s.pending && `<span class="pill">not bought yet</span>`,
      s.date && `<span class="pill">${esc(s.date)}</span>`].filter(Boolean).join("");
    return `<div class="swaps">${swaps.map(s => `
      <div class="swap"><div class="pair">${cardHTML(s.out, "out")}<div class="arrow">→</div>${cardHTML(s.in, "in")}</div>
      ${flags(s) ? `<div class="flags">${flags(s)}</div>` : ""}
      ${s.why ? `<div class="why">${esc(s.why)}</div>` : ""}</div>`).join("")}</div>`;
  }

  // Plain buy list (used by the bracket 3 package): price table + copyable text
  function listHTML(id, title, swaps, open) {
    const items = swaps.filter(s => !s.owned).map(s => ({ ...s, p: price(s.in) })).sort((a, b) => (b.p.eur ?? 0) - (a.p.eur ?? 0));
    const sum = cur => items.reduce((t, s) => t + (s.p[cur] ?? 0), 0);
    return `<details class="buy"${open ? " open" : ""}>
      <summary><span class="t">🛒 ${esc(title)}: ${items.length} cards</span><span>${both(sum("usd"), sum("eur"))}</span></summary>
      <div class="body">
        <div class="table-scroll"><table>
          <tr><th>Card</th><th class="num">EUR</th><th class="num">USD</th><th>Replaces</th></tr>
          ${items.map(s => `<tr><td>${esc(s.in)}${(card(s.in) || {}).game_changer ? ` <span class="muted small">(Game Changer)</span>` : ""}</td>
            <td class="num" title="${esc(s.p.eur_set || "")}">${money(s.p.eur, "€")}</td>
            <td class="num" title="${esc(s.p.usd_set || "")}">${money(s.p.usd, "$")}</td>
            <td class="small muted">${esc(s.out)}</td></tr>`).join("")}
          <tr><td><b>Total</b></td><td class="num"><b>${money(sum("eur"), "€")}</b></td><td class="num"><b>${money(sum("usd"), "$")}</b></td><td></td></tr>
        </table></div>
        <div>
          <div class="copy-row"><button class="copy" data-copy="${id}">Copy list</button><span class="copied" hidden>Copied ✓</span></div>
          <textarea id="${id}" readonly>${esc(items.map(s => `1 ${s.in}`).join("\n"))}</textarea>
          <p class="small muted" style="margin-top:6px">Cardmarket: Wants → create a Magic list → <b>Add Deck List</b> → paste → <b>Add</b>, then run the <b>Shopping Wizard</b>.</p>
        </div>
      </div></details>`;
  }

  // Buy list for one direction (core package + its own swaps), Cardmarket Wants format
  function buyHTML(d) {
    const core = (D.core && D.core.swaps) || [];
    const items = [...core.map(s => ({ ...s, part: D.core.name })), ...d.swaps.map(s => ({ ...s, part: d.name }))]
      .map(s => ({ ...s, p: price(s.in) }))
      .sort((a, b) => (b.p.eur ?? 0) - (a.p.eur ?? 0));
    const text = items.map(s => `1 ${s.in}`).join("\n");
    const budget = D.budget_eur != null ? ` · budget €${D.budget_eur}` : D.budget_usd != null ? ` · budget $${D.budget_usd}` : "";
    return `<details class="buy"${d.picked ? " open" : ""}>
      <summary><span class="t">🛒 Buy list: ${items.length} cards</span><span>${both(d.cost_usd, d.cost_eur)}${budget}</span></summary>
      <div class="body">
        <div class="table-scroll"><table>
          <tr><th>Card</th><th class="num">EUR</th><th class="num">USD</th><th>Replaces</th></tr>
          ${items.map(s => `<tr><td>${esc(s.in)}${s.part !== d.name ? ` <span class="muted small">(core)</span>` : ""}</td>
            <td class="num" title="${esc(s.p.eur_set || "")}">${money(s.p.eur, "€")}</td>
            <td class="num" title="${esc(s.p.usd_set || "")}">${money(s.p.usd, "$")}</td>
            <td class="small muted">${esc(s.out)}</td></tr>`).join("")}
          <tr><td><b>Total</b></td><td class="num"><b>${money(d.cost_eur, "€")}</b></td><td class="num"><b>${money(d.cost_usd, "$")}</b></td><td></td></tr>
        </table></div>
        <div>
          <div class="copy-row"><button class="copy" data-copy="buy-${slug(d.id || d.name)}">Copy list</button><span class="copied" hidden>Copied ✓</span></div>
          <textarea id="buy-${slug(d.id || d.name)}" readonly>${esc(text)}</textarea>
          <p class="small muted" style="margin-top:6px">Cardmarket: Wants → create a Magic list → <b>Add Deck List</b> → paste → <b>Add</b>, then run the <b>Shopping Wizard</b>. Also works for TCGplayer Mass Entry.</p>
        </div>
      </div></details>`;
  }

  // How-to-play guide for one direction (optional `how_to_play` in the spec)
  function htpHTML(d) {
    const g = d.how_to_play;
    if (!g) return "";
    return `<details class="buy htp"${d.picked ? " open" : ""}>
      <summary><span class="t">🎮 How to play</span><span class="muted small">${esc(g.summary || "")}</span></summary>
      <div class="htp-body">${(g.sections || []).map(sec => `<div class="htp-sec"><h4>${esc(sec.title)}</h4>
        <ul>${(sec.points || []).map(pt => `<li>${esc(pt)}</li>`).join("")}</ul></div>`).join("")}</div></details>`;
  }

  const dirs = D.directions;
  const stock = D.stock_curve;
  const maxBar = Math.max(...[stock, ...dirs.map(d => d.curve)].flatMap(c => Object.values(c.buckets))) + 2;
  const metricKeys = [...new Set(dirs.flatMap(d => Object.keys(d.metrics || {})))];
  const stockMetrics = (D.analysis && D.analysis.stock_metrics) || {};
  const cmd = D.commanders.map(card).filter(Boolean)[0];

  let h = "";
  h += `<header class="top">${cmd && cmd.images[0] ? `<img src="${esc(cmd.images[0].normal)}" alt="${esc(cmd.name)}" data-name="${esc(cmd.name)}">` : ""}
    <div><div class="muted small">${esc(D.deck)} · ${esc(D.date || "")}</div><h1>${esc(D.title)}</h1>
    ${D.summary ? `<p>${esc(D.summary)}</p>` : ""}
    <p class="muted small">Prices: cheapest paper printing on Scryfall (USD from TCGplayer, EUR from Cardmarket), Scryfall bulk data of ${esc(D.prices_as_of || "?")}. Hover a price to see which printing.</p></div></header>`;

  h += `<nav class="jump"><a href="#analysis">Stock analysis</a><a href="#compare">Comparison</a>
    ${D.core && D.core.swaps.length ? `<a href="#core">${esc(D.core.name)}</a>` : ""}
    ${dirs.map(d => `<a href="#${slug(d.id || d.name)}">${esc(d.name)}</a>`).join("")}
    ${(D.deck_changes || []).length ? `<a href="#changes">Later changes</a>` : ""}
    ${D.bracket3 ? `<a href="#bracket3">${esc(D.bracket3.name)}</a>` : ""}</nav>`;

  // Stock analysis
  const A = D.analysis || {};
  h += `<h2 id="analysis">Stock deck analysis</h2><div class="grid2">
    <div class="panel"><h3>Mana curve <span class="muted small">· ${stock.nonland} nonland · avg MV ${stock.average}</span></h3>
      ${curveHTML(stock.buckets, null, maxBar)}
      ${A.notes ? `<ul class="notes" style="margin-top:12px">${A.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}</div>
    <div class="panel"><h3>Interaction & key categories</h3><div class="table-scroll"><table>
      <tr><th>Category</th><th class="num">Stock</th><th class="num">Target</th><th>Cards</th></tr>
      ${(A.interaction || []).map(r => `<tr><td>${esc(r.category)}</td><td class="num ${r.low ? "bad" : ""}">${esc(r.stock)}</td>
        <td class="num">${esc(r.target)}</td><td class="small muted">${esc((r.cards || []).join(", "))}</td></tr>`).join("")}
    </table></div></div></div>`;

  // Comparison
  h += `<h2 id="compare">Direction comparison</h2><div class="panel table-scroll"><table>
    <tr><th></th><th class="num">Stock</th>${dirs.map(d => `<th class="num">${esc(d.name)}${d.recommended ? ` <span class="rec">★</span>` : ""}${d.picked ? ` <span class="pill picked">✓ picked</span>` : ""}</th>`).join("")}</tr>
    <tr><td>Average MV (nonland)</td><td class="num">${stock.average}</td>${dirs.map(d => `<td class="num">${d.curve.average}</td>`).join("")}</tr>
    <tr><td>Cost of cards in</td><td class="num">—</td>${dirs.map(d => `<td class="num"><b>${both(d.cost_usd, d.cost_eur)}</b></td>`).join("")}</tr>
    <tr><td>Value of cards out</td><td class="num">—</td>${dirs.map(d => `<td class="num muted">${both(d.out_value_usd, d.out_value_eur)}</td>`).join("")}</tr>
    ${metricKeys.map(m => `<tr><td>${esc(m)}</td><td class="num">${esc(stockMetrics[m] ?? "")}</td>${dirs.map(d => `<td class="num">${esc((d.metrics || {})[m] ?? "")}</td>`).join("")}</tr>`).join("")}
    <tr><td>Plays like</td><td></td>${dirs.map(d => `<td class="small">${esc(d.plays_like || "")}</td>`).join("")}</tr>
    </table>${D.core && D.core.swaps.length ? `<p class="small muted" style="margin-top:8px">Costs include the ${esc(D.core.name)} (${both(D.core.cost_usd, D.core.cost_eur)}).</p>` : ""}</div>`;

  h += `<div class="curves" style="margin-top:16px">${dirs.map(d => `<div class="panel"><h3>${esc(d.name)} <span class="muted small">avg ${d.curve.average}</span></h3>
    ${curveHTML(d.curve.buckets, stock.buckets, maxBar)}</div>`).join("")}</div>
    <div class="legend"><span class="l-fill">after swaps</span><span class="l-ghost">stock</span></div>`;
  if (D.recommendation) h += `<div class="panel" style="margin-top:16px"><b class="rec">★ Recommendation.</b> ${esc(D.recommendation)}</div>`;

  // Core package
  if (D.core && D.core.swaps.length) {
    h += `<section class="dir" id="core"><div class="dir-head"><h2 style="margin:0">${esc(D.core.name)}<span class="pill">all directions</span></h2>
      <div class="totals">In: <b>${both(D.core.cost_usd, D.core.cost_eur)}</b></div></div>
      ${D.core.description ? `<p class="muted">${esc(D.core.description)}</p>` : ""}${swapsHTML(D.core.swaps)}</section>`;
  }

  // Directions
  for (const d of dirs) {
    h += `<section class="dir" id="${slug(d.id || d.name)}"><div class="dir-head">
      <h2 style="margin:0">${esc(d.name)}${d.picked ? `<span class="pill picked">✓ picked</span>` : ""}${d.recommended ? `<span class="pill rec">★ recommended</span>` : ""}</h2>
      <div class="totals">Direction swaps + core: <b>${both(d.cost_usd, d.cost_eur)}</b> · avg MV ${d.curve.average}</div></div>
      ${d.pitch ? `<p class="muted">${esc(d.pitch)}</p>` : ""}${d.win_conditions_note ? `<p class="small"><b>Win conditions:</b> ${esc(d.win_conditions_note)}</p>` : ""}${buyHTML(d)}${htpHTML(d)}${swapsHTML(d.swaps)}</section>`;
  }

  // Changes made to the played deck after the picked direction was applied
  if ((D.deck_changes || []).length) {
    h += `<section class="dir" id="changes"><div class="dir-head"><h2 style="margin:0">Later changes<span class="pill picked">✓ in the deck</span></h2></div>
      <p class="muted">Swaps made in ${esc(D.played_deck || "the deck")} after the picked direction was applied. The picked direction plus these is the deck as you play it.</p>
      ${swapsHTML(D.deck_changes)}</section>`;
  }

  // Bracket 3 package: against the deck as played, always the last section
  const B = D.bracket3;
  if (B) {
    const gcAll = B.gc_now.length + B.gc_core.length + B.gc_premium.length - B.gc_out.length;
    const wc = B.win_conditions || {};
    h += `<section class="dir" id="bracket3"><div class="dir-head">
      <h2 style="margin:0">${esc(B.name)}${B.applied ? `<span class="pill picked">✓ in the deck since ${esc(B.applied)}</span>` : ""}${B.declined ? `<span class="pill">not planned</span>` : ""}<span class="pill gc">up to 3 Game Changers</span></h2>
      <div class="totals">Package: <b>${both(B.cost_usd, B.cost_eur)}</b>${B.budget_eur != null ? ` · budget €${B.budget_eur}` : ""} · avg MV ${B.avg_now} → ${B.avg_after}</div></div>
      ${B.declined ? `<p><b>Not planned.</b> On ${esc(B.declined)} you chose to keep this deck as it is, so these swaps are kept here for reference only.</p>` : ""}
      <p class="muted">${esc(B.description || "")}</p>
      <p class="small muted">${esc(B.rule || "")} ${B.applied ? `These swaps are in ${esc(D.played_deck || D.deck)} since ${esc(B.applied)}; "Before" is the deck just before them.` : `These swaps apply to ${esc(D.played_deck || D.deck)}, the deck as you play it now${B.date ? ` (${esc(B.date)})` : ""}.`}</p>
      <div class="panel table-scroll" style="margin:12px 0"><table>
        <tr><th></th><th class="num">${B.applied ? "Before" : "Now"}</th><th class="num">${B.applied ? "With the package (now)" : "With the package"}</th><th class="num">With every premium option</th></tr>
        <tr><td>Game Changers (bracket 3 allows 3)</td><td class="num">${B.gc_now.length}</td><td class="num">${B.gc_now.length + B.gc_core.length}</td><td class="num">${gcAll}</td></tr>
        <tr><td>Which</td><td class="small muted">${esc(B.gc_now.join(", ") || "none")}</td><td class="small muted">${esc([...B.gc_now, ...B.gc_core].join(", ") || "none")}</td><td class="small muted">${esc([...B.gc_now, ...B.gc_core, ...B.gc_premium].filter(n => !B.gc_out.includes(n)).join(", ") || "none")}</td></tr>
        ${wc.now != null ? `<tr><td>Win conditions</td><td class="num">${esc(wc.now)}</td><td class="num">${esc(wc.after)}</td><td class="num"></td></tr>` : ""}
        <tr><td>Cost of cards in</td><td class="num">—</td><td class="num"><b>${both(B.cost_usd, B.cost_eur)}</b></td><td class="num">${both(B.cost_usd + B.premium_cost_usd, B.cost_eur + B.premium_cost_eur)}</td></tr>
      </table></div>
      ${(B.notes || []).length ? `<ul class="notes">${B.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      ${listHTML("buy-bracket3", "Buy list", B.swaps, true)}
      ${swapsHTML(B.swaps)}
      ${(B.premium || []).length ? `<h3 style="margin:24px 0 4px">Premium options</h3>
        <p class="muted">Stronger and more expensive. Each one is optional and comes with its own cut. Together: ${both(B.premium_cost_usd, B.premium_cost_eur)}.</p>
        ${listHTML("buy-bracket3-premium", "Premium buy list", B.premium, false)}${swapsHTML(B.premium)}` : ""}
      </section>`;
  }

  h += `<footer>Card images and prices via <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>. Generated ${esc(D.generated)}. Rebuild with <code>python3 tools/build_comparison.py &lt;spec&gt;.json</code>.</footer>`;
  document.getElementById("app").innerHTML = h;

  // Lightbox: click any card image for the large scan (both faces for DFCs)
  const lb = document.getElementById("lightbox");
  // Copy buttons for buy lists (clipboard API, with a select+execCommand fallback for file:// pages)
  document.addEventListener("click", async e => {
    const btn = e.target.closest("button.copy");
    if (!btn) return;
    const ta = document.getElementById(btn.dataset.copy);
    try { await navigator.clipboard.writeText(ta.value); }
    catch { ta.select(); document.execCommand("copy"); }
    const ok = btn.parentElement.querySelector(".copied");
    ok.hidden = false; setTimeout(() => { ok.hidden = true; }, 1800);
  });

  document.addEventListener("click", e => {
    if (e.target.closest("#lightbox")) { lb.classList.remove("open"); lb.innerHTML = ""; return; }
    const img = e.target.closest("img[data-name]");
    if (!img) return;
    const c = card(img.dataset.name);
    lb.innerHTML = (c ? c.images : [{ large: img.src }]).map(i => `<img src="${esc(i.large || i.normal)}" alt="">`).join("");
    lb.classList.add("open");
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { lb.classList.remove("open"); lb.innerHTML = ""; } });
})();
</script>
</body>
</html>
